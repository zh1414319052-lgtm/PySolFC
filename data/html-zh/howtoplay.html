<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>触控操作指南</title></head>
<body><h1>触控操作指南</h1>
<h3>移动和翻牌</h3>
<p>先点想移动的牌，再点目标位置。设置中的“触控方式”也提供拖放。</p>
<p>规则允许时，点发牌堆可以翻牌或重新发牌。撤销、重做和提示通常可以在工具栏或工具菜单中找到。</p>
<h3>换一种游戏</h3>
<p>打开“菜单”里的“游戏”，选择热门游戏或展开分类。打开“帮助”里的“本局游戏规则”可查看当前玩法。</p>
<p>在牌局内使用“牌局管理”可保存、读取或退出。已经移动过的牌局切换时可能需要确认。</p>
</body></html>
