<h1>插件</h1>
<p>
PySolFC 可以支持添加额外的游戏，或通过编写作为插件的 Python 脚本进行其他修改。这些脚本可以添加到用户文件夹的插件文件夹或 PySolFC 安装目录中。插件可用于创建和添加对于用户来说过于复杂的游戏
<a href='solitaire_wizard.html'>纸牌向导</a> 选项。
<p>
PySolFC 网站上提供了几个示例插件可供下载
<a href='https://sourceforge.net/projects/pysolfc/files/Sample%20Plugins/'>这里</a>。这些插件重新创建了 PySol 的一些更复杂的游戏，包括
<a href='rules/demonsandthieves.html'>恶魔与盗贼</a> 和
<a href='rules/crossword.html'>填字游戏</a> 并且可以用作帮助编写您自己的插件的指南。
