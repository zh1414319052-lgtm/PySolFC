<h1>怀特霍斯</h1>
<p>
经典接龙类型。 1 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
七张牌被发到七个列牌堆上。列牌堆是按红黑交替排列的，任何有效的牌序列都可以在列牌堆之间移动。空白的画面空间立即从翻牌堆的顶部牌中填充。
<p>
从画面到翻牌堆，一次可以发三张牌。翻牌堆堆最上面的牌可以移到桌面或收牌堆上。
<p>
基础是由从 A 到 K 的花色建立起来的。如果所有牌都移至牌堆，则游戏获胜。
