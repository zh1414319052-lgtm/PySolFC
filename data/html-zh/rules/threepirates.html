<h1>三海盗</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到十堆列牌堆，每堆四张牌。列牌堆是用相同的花色建造的。列牌堆之间只能移动单张牌。
<p>
发牌堆可以一次发三张牌，每三个翻牌堆一张。翻牌堆中的牌可以移到列牌堆或收牌堆上。
<p>
基础是按花色建立的，从 A 到 K。如果所有牌都移至牌堆，则游戏获胜。
