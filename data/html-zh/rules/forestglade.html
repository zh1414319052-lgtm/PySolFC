<h1>森林空地</h1>
<p>
粉丝游戏类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌分为 16 堆，每堆三张牌。列牌堆是按同花色堆积起来的，一次只能移动一张牌。空堆可以由国王来填补。
<p>
有两套基础。一组从奇数等级的 A 开始（A-3-5-7-9-J-K），另一组由偶数等级的两张 A（2-4-6-8-10-Q）组成。
<p>
牌可以重新洗牌并重新发牌两次。如果有任何空位，可以从发牌堆发三张牌来填补该堆（这不算是重发）。
<p>
如果所有牌都移至牌堆，则游戏获胜。
