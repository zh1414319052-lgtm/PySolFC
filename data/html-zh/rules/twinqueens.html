<h1>双人大号床间</h1>
<p>
四十大盗类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="fortythieves.html">四十大盗</a>，但布局不同，由八堆一张牌组成，基础位于中间。8 堆以相同的花色建造，空的堆会自动用翻牌堆或发牌堆填充。
<p>
收牌堆是用与国王相同的花色建造的，根据需要转动拐角，皇后位于完成的收牌堆之上。
<p>
此外，允许重发一次。
