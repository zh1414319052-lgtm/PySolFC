<h1>俄罗斯人的耐心（Die Russische）</h1>
<p>
经典接龙类型。 2 层剥离副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
该游戏采用两副剥离牌进行，由每种花色的七张王牌和 A 组成。一张 A 发到牌堆，其余的牌均匀发到七个列牌堆。
<p>
基础花色从 Ace 开始，然后从 7 到 K。
<p>
列牌堆以红黑交替构建。序列可以移动，并且空格可以由任何填充 <i>单身</i> 牌。
