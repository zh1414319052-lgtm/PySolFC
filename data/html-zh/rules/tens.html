<h1>十</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
画面上发了十三张牌。总共十张的牌对可以移动到基础上，并且空间可以从发牌堆中填充。
<p>
十张和图片卡以四张为一组被移除。这些可以通过将它们移动到四个备用区来丢弃（所有四张卡必须移动到备用区并同时丢弃）。
<p>
如果所有牌都被丢弃，则游戏获胜。

<h3>补充说明</h3>
<p>

<i>自动投放</i> 此游戏已禁用。
