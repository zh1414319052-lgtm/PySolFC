<h1>三十六</h1>
<p>
经典接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到六堆列牌堆，每堆六张牌。在最初的发牌过程中，任何要发的 A 都会立即转移到收牌堆中。列牌堆是按点数递减的，无论花色如何。
<p>
可以从发牌堆上一次发一张牌。不允许重发。
<p>
基础是按照从 A 到 K 的花色建立起来的。当所有牌都移至牌堆时，游戏获胜。
