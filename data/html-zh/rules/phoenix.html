<h1>凤凰城</h1>
<p>
拉格伦型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到六堆，每堆六张牌。剩下的十六张牌作为备用牌分发到画面的两侧。列牌堆按红黑交替排列，任何牌或有效的牌序列都可以在堆之间移动。保留卡可以移至画面的基础，但卡不能移至备用区。
<p>
基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
