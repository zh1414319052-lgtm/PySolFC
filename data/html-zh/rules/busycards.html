<h1>忙碌卡</h1>
<p>
拿破仑型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
每种花色的一张 A 和一张 K 发到本位牌，剩余的牌发到十二堆，每堆八张牌。列牌堆是按相同花色上下排列的，列牌堆之间只能移动单张牌。任何卡牌都可以填充空的列牌堆。
<p>
有六个空当，一个位于每对列牌堆上方。任何单张纸牌都可以移动到这些空当中，但只有当单元格下的两个列牌堆都为空时，才能将纸牌从空当中移出。
<p>
带有 A 的基础由从 A 到 K 的相同花色组成，带有 K 的基础由从 K 到 A 的相同花色组成。
