<h1>前细胞</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="freecell.html">空当接龙</a>，但比赛开始时预备队已满，只有国王队有空位。

<h3>历史</h3>
<p>
根据
<a href="http://www.solitairelaboratory.com/fcfaq.html">空当接龙常见问题解答</a>
这是第一个与空当接龙极其相似的已知游戏。它是在瑞典发明的，至少可以追溯到 1945 年。
