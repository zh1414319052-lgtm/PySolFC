<h1>对比度</h1>
<p>
两副牌游戏类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
所有的五和六都发到收牌堆。 5 的收牌堆按 A 的花色顺序排列，然后将 K 放在 A 上，而 6 的收牌堆按 Q 的花色排列。
<p>
牌从发牌堆上一次发一张，并且可以移动到适当的基础上。您可以重发一次，因此您最多可以浏览这副牌两次。如果所有牌都移至牌堆，则游戏获胜。

<h3>补充说明</h3>
<p>
该游戏也称为 Cotilion。
