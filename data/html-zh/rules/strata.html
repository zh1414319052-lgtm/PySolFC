<h1>地层</h1>
<p>
贝克十二类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌发到八叠，每叠十三张。画面桩是按红黑交替建造的。单张牌可以在列牌堆之间移动。牌可以移至接牌区，接牌区由 A 开始，由相同花色组成。任何牌都可以填充空的画面列。
<p>
当没有剩余手数时，剩余的工作牌可以重新洗牌并重新发牌。每场比赛可以进行两次。
<p>
如果所有牌都移至牌堆，则游戏获胜。
