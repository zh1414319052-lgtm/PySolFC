<h1>交界处</h1>
<p>
四十大盗类型。 4 层剥离副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
Junction 只使用四副牌中从七张到 A 的牌进行游戏。
<p>
七个列牌堆各发一张牌。列牌堆是按红黑交替排列的，任何牌或牌序列都可以在列牌堆之间移动。可以一次从发牌堆上发一张牌，然后将牌移到适当的画面或收牌堆上。
<p>
基础是由相同的花色组成的，从 A 开始，然后在 A 上打 7，然后逐渐增加到 K。如果所有牌都移至牌堆，则游戏获胜。
