<h1>埃菲尔铁塔</h1>
<p>
配对游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有卡牌移至列牌堆。

<h3>玩法规则</h3>
<p>
这是一个非常简单的游戏，它的名字来源于布局的形状。目标是用完发牌堆上的所有卡牌，将它们放在塔上。只有当两张牌的数值加起来为 14 时，您才可以将一张牌放在另一张牌上。K 的数值为 13，Queen 的数值为 12，Jack 的数值为 11。您不必跟风。
<p>
当发牌堆全部消失时，你就赢了。不能重新发牌。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 和 <i>快速游戏</i> 已禁用此游戏。
