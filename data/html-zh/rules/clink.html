<h1>叮叮当当</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
每种颜色的一张 A 会发到两个基牌上，牌会发到八堆列牌堆上，每堆六张牌。剩下的两张牌被发给两个空闲的备用单元。
<p>
画面桩是按红黑交替建造的。任何适当的卡牌序列都可以在列牌堆之间移动，并且任何有效的卡牌或序列都可以移动到空的列牌堆堆中。任何一张卡都可以移入或移出其中一个备用单元。
<p>
基础是通过红黑交替（从 A 到 K）叠放的，然后环绕形成第二个序列。如果所有牌都移至牌堆，则游戏获胜。
