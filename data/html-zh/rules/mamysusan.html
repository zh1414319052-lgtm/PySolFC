<h1>苏珊妈妈</h1>
<p>
露台类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
十堆列牌堆各发四张牌。画面桩是按红黑交替建造的。列牌堆之间只能移动单张牌，并且任何单张牌都可以填满空牌堆。另外六张牌发给备用牌，只有顶牌面朝上。这些备用卡只能移至牌堆。
<p>
可以一次从发牌堆上发一张牌，然后将牌移到牌堆或列牌堆上。不允许重发。
<p>
基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。

<h3>补充说明</h3>
<p>
