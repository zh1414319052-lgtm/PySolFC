<h1>文森特</h1>
<p>
风扇型。 1 副牌。没有重售。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="bristol.html">布里斯托尔</a>，但列牌堆是按相同花色建造的，牌序列可以一起移动，并且可以将K打到空牌堆上。基础是由同一套衣服建立起来的。
