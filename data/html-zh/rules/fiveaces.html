<h1>五张王牌</h1>
塔罗克型。 1 副牌。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
这是一个
<a href="bakersdozen.html">贝克的十几个</a>
使用 78 张 Tarock 牌玩的类型游戏。桩以红黑交替排列。王牌可以选择任何一种颜色。游戏开始时，五张 A 会发到收牌堆。

<h3>玩法规则</h3>
行按红黑交替排列，王牌则以任一颜色进行游戏。一堆牌可以移动到另一个位置，但在空行上只能打出一张牌。可以从基础开始打牌。

<h3>技巧</h3>
使用王牌来打开花色牌的位置。
