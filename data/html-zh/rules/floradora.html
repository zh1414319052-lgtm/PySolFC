<h1>弗洛拉多拉</h1>
<p>
四十大盗类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
六张列牌堆各发六张牌。列牌堆是按点数递减的，无论花色如何。单张牌可以在列牌堆之间移动。任何卡牌都可以移至空牌堆中。可以从发牌堆上一次发一张牌，然后将牌打到牌堆或列牌堆上。不允许重发。
<p>
基础是由从 A 到 Q 的花色建立起来的。发牌堆下方还有一个额外的底座，用于容纳国王。如果所有牌都移至牌堆，则游戏获胜。
