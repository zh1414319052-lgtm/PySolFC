<h1>十八岁</h1>
<p>
配对游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
画面上发了十二张牌。牌以四张为一组被移除，其中包括一张人头牌和三张不同等级的牌，总计 18 点 - 这是通过将所有四张牌移动到特殊的备用堆中来完成的。 A 被单独移除。每组被移除后，发牌堆上的空白空间就会被填充。
<p>
如果所有牌都被丢弃，则游戏获胜。

<h3>补充说明</h3>
<p>

<i>自动投放</i> 此游戏已禁用。
