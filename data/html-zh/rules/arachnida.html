<h1>蛛形纲</h1>
<p>
蜘蛛型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 K 到 A 的花色降序排列为 13 张牌组，并将这些牌组移至基础。

<h3>玩法规则</h3>
<p>
牌被发到十堆列牌堆上——四堆有六张牌，六堆有五张牌。只有每堆最上面的牌是面朝上的。列牌堆按点数或按相同等级向下构建。只有相同等级或按花色组合的单张牌或牌序列可以在列牌堆之间移动。
<p>
当没有剩余动作时，您可以从发牌堆中向每个列牌堆发一张牌。
<p>
当创建从 K 到 A 的相同花色序列时，它会立即移至收牌堆。如果所有牌都移至收牌堆，则游戏获胜。
