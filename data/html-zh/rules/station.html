<h1>车站</h1>
<p>
蒙大拿州类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌按照花色从“二”到“K”的升序排列为一组 12 张牌。

<h3>玩法简介</h3>
<p>
就像 <a href="montana.html">蒙大拿州</a>，但每次重发后的空格位于每行的末尾。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
