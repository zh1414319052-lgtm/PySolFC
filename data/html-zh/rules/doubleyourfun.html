<h1>双倍乐趣</h1>
花札型。 2 副牌。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
玩法类似于
<a href="freecell.html">空当接龙</a>。相同花色的行按点数递减。收牌堆是用相同等级的牌按花色顺序建造的。

<h3>玩法规则</h3>
行按花色从第一级到第四级排列。收牌堆按照等级从松树到凤凰城的升序顺序建造。第三和第四等级（垃圾）卡在画面上不可互换。牌不能从基础开始打。只有第一排牌或顺序正确的牌堆才可以在空行上打出。

<h3>技巧</h3>
首先使用备用堆释放第四等级的牌。
