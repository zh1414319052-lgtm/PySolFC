<h1>路易斯</h1>
<p>
两副牌游戏类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="sthelena.html">圣赫勒拿岛</a>，但在游戏开始时，十二个列牌堆中的每堆都会发一张牌。在这一轮中，空的工作列牌堆将立即从发牌堆中填充。当没有剩下的棋步时，就可以处理这副牌的其余部分。
<p>
此外，对于哪些列牌堆牌可以移至接牌区没有任何限制，并且列牌堆可以按相同花色向上或向下构建。
