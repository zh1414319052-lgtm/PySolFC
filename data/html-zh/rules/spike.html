<h1>斯派克</h1>
<p>
经典接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="klondike.html">经典接龙</a>，但是发牌堆每次发三张牌，每三个翻牌堆一张。这些卡牌可以移动到画面或基础上。不允许重发。这类似于
<a href="bristol.html">布里斯托尔</a>.
