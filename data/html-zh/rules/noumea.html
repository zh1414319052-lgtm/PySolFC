<h1>努美阿</h1>
<p>
一层游戏类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
4 张 A 发到基牌堆，20 张牌发到备用堆。备用堆可以容纳一张牌，并在空时自动从翻牌堆或发牌堆中填充。
<p>
列牌堆上没有建筑物，所以你只能将牌移动到收牌堆上。
<p>
当没有剩余的移动时，你可以一次从发牌堆上发三张牌，并将它们移动到适当的基础上。允许重发两次，因此您可以浏览这副牌三遍。如果所有牌都移至牌堆，则游戏获胜。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
