<h1>阿罕布拉</h1>
<p>
两副牌游戏类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
游戏开始时，每种花色的一张 A 和一张 K 会发到牌堆，八叠四张牌作为备用牌。
<p>
牌每次从发牌堆发到翻牌堆。备用牌可以移至翻牌堆，翻牌堆按相同花色向上或向下构建。备用牌和翻牌堆中的牌也可以移至牌堆。
<p>
库存清空后，翻转翻牌堆并再次检查库存，包括该轮添加的新卡。允许重发两次，因此您最多可以翻阅这副牌三遍。
<p>
如果所有牌都移至牌堆，则游戏获胜。
