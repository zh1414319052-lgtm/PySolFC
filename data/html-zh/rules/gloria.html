<h1>格洛丽亚</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌发到 24 堆，每堆四张牌，其中 K 发到接龙牌。画面上不允许有任何建筑物。 K 的基础由相同花色组成，而第二组则由 A 组成。
<p>
有两个空当可以将画面中的牌移动到其中，但是这些空当中的牌只能移动到基础上。如果所有牌都移至牌堆，则游戏获胜，尽管每个牌堆中有多少张牌并不重要。
