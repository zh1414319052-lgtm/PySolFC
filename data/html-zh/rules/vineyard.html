<h1>葡萄园</h1>
<p>
贝克十二类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="bakersdozen.html">贝克的十几个</a>，不过是 10 堆，是按红黑交替叠下来的，任何一张牌都可以填满一个空位。

<h3>补充说明</h3>
<p>
Vineyard 由 Peter Voke 发明，最初是在 Pretty Good Solitaire 应用程序的 Solitaire Wizard 中创建的。此后它已被移植到许多其他纸牌应用程序中。
