<h1>堡垒</h1>
<p>
被围困的城堡类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
十根桩建成 <b>向上或向下</b> 按西装。一次只能移动一张牌，空的牌堆可以用任何一张牌填充。

<h3>类似游戏</h3>
<p>
这是一个非常困难的游戏 - 尝试一下
<a href="chessboard.html">棋盘</a>
以获得更有趣的变体。
