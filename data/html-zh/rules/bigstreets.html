<h1>大街道</h1>
<p>
四十大盗类型。 3 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
三副牌变体，基础玩法参见 <a href="streets.html">街道</a>.
<p>
玩法类似于 <a href="fortythieves.html">四十大盗</a>，但有三副牌和十二个列牌堆，并且这些列牌堆按红黑交替向下构建。
