<h1>科罗拉多州</h1>
<p>
数值类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
二十张牌发到二十堆。每种花色的一张 A 和一张 K 都会发到收牌堆上。
<p>
画面中的牌可以移至基础中。从A开始的基础是按花色建立的，而从K开始的基础是按花色向下建立的。
<p>
牌每次从发牌堆发一张，并立即移至列牌堆或收牌堆中。牌不能在列牌堆之间移动，空的牌堆会立即从发牌堆填充。
<p>
如果所有牌都移至牌堆，则游戏获胜。
