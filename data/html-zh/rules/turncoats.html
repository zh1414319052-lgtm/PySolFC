<h1>叛徒</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
十二个列牌堆每堆都会发一张牌。列牌堆按照不同的颜色向上或向下排列，这样只有每堆最上面的牌是可见的。只能在牌堆之间移动单张牌。空的牌堆会立即被发牌堆上的一张牌填满。当发牌堆空了的时候，空堆就无法被填满。
<p>
基础是由从 A 到 K 的相同花色建立的。当所有牌都移至牌堆时，游戏获胜。
