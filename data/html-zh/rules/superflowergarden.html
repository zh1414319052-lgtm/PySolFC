<h1>超级花园</h1>
<p>
粉丝游戏类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
就像 <a href="labellelucie.html">美丽露西</a>，但桩是按点数递减的。

<h3>玩法规则</h3>
<p>
18 桩按点数递减。一次只能移动一张卡。空堆不会被填满。
<p>
当无法再移动时，单击发牌堆。桌面上的所有牌都将重新洗牌。
