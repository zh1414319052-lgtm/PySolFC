<h1>黑兰亚克沙</h1>
<p>
空当接龙类型。一张 Dashavatara Ganjifa 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="snake.html">蛇</a>，使用十套 Dashavatara Ganjifa 牌组，并且您可以按顺序移动的牌数不受限制。

<h3>玩法规则</h3>
<p>
游戏开始时，所有牌都会发到 9 堆，每个 Raja 或 King 开始新的一堆。无论花色如何，行都会按点数递减。空行无法填充。十个空当各可容纳一张卡。
