<h1>四乘四</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌堆。

<h3>玩法规则</h3>
<p>
一张牌被发到收牌堆。基础是用同等级的卡牌建立起来的。一旦该等级的所有四张牌都进入收牌堆，您就可以将下一等级的牌放在上面 - 因此，如果首先发到三张牌，则所有四张三张牌都可以添加到收牌堆中，一旦它们到达那里，您就可以开始放置四张牌。一旦打出 K，序列就会转向并从 A 继续。
<p>
牌每次从发牌堆发一张，废牌可以移至四个列牌堆之一。工作列牌堆栈按点数向上或向下建立，无论花色如何。卡一次只能移动一张。不能重新发牌。
