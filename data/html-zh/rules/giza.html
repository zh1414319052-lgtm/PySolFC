<h1>吉萨</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="pyramid.html">金字塔接龙</a>，但没有发牌堆。相反，所有剩余的牌都被发到八堆备用牌，每堆三张牌，其顶部可以与金字塔中的牌或其他备用牌的顶部配对。
<h3>补充说明</h3>
<p>
吉萨是迈克尔·凯勒发明的金字塔的开放变体。
