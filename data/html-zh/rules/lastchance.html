<h1>最后的机会</h1>
<p>
数值类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
游戏开始时，会发一张面朝下的牌作为备用牌。这是最后的机会卡。
<p>
六张牌被发到六个列牌堆上。牌每次从发牌堆发一张，并立即打到桌面或收牌堆上。无论花色或等级如何，都可以建造列牌堆。空的列牌堆可以用其他列牌堆的牌填充，但除此之外，列牌堆上的牌无法移动。
<p>
一旦发牌堆和翻牌堆清空，最后机会卡就会翻转并可以打到接龙堆上。
<p>
基础是按花色建立的，从 A 开始。
