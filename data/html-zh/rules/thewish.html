<h1>愿望</h1>
<p>
配对游戏类型。 1 层剥离副牌。不能重新发牌。

<h3>目标</h3>
<p>
丢弃所有相同点数的牌对。

<h3>玩法规则</h3>
<p>
该游戏仅使用从 7 到 K 以及 A 的牌进行游戏。牌分为八堆，每堆四张牌。画面中相同等级的暴露卡牌可以被移除。
<p>
当列牌堆全部消失时，您就赢了。
