<h1>拿破仑墓</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌一次从发牌堆上发一张，并且可以移动到基础或四个空当之一。有四个收牌堆，无论花色如何，按点数从 7 到 K，位于角落，还有第五个收牌堆，无论花色如何，按点数从 6 到 A，然后从 A 到 6，最终连续建立四次。
<p>
四个空当位于中心基础的正上方、下方、左侧和右侧。这些可以包含一张卡，并且只能移动到基础。不允许重发。如果所有牌都移至牌堆，则游戏获胜。
