<h1>水牛比尔</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌发到 26 堆，每堆四张牌。画面上不允许有任何建筑物。画面中的牌只能移动到基础或八个空当之一。四个基础由 A 到 K 的同花色组成，另外 4 个基础由 K 到 A 的同花色组成，每种花色各有一个基础。单张牌可以移动到每个空当，并且只能从那里移动到基础。
<p>
当所有牌都移至牌堆时，游戏获胜。
