<h1>懒惰城堡</h1>
<p>
被围困的城堡类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌会发到四堆列牌堆（每堆七张牌）和四堆列牌堆（每堆六张牌）。剩余的牌被发到四堆备用牌，每堆十三张牌。
<p>
无论花色如何，列牌堆都是按点数递减的。单张牌可以在牌堆之间移动，任何单张牌都可以填满空牌堆。单张牌可以从备用牌移至列牌堆或收牌堆。
<p>
基础桩是按点数建立的，无论从 A 到 K 的花色如何。如果所有牌都移至牌堆，则游戏获胜。
