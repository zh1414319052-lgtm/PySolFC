<h1>六人制和七人制</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
所有八个六七都被分配到十六个基桩上。画面上还发了九张牌。画面上不允许有任何建筑物。
<p>
以 6 开头的基础是按花色到 A 建立的，而以 7 开头的基础是按花色到 K 建立的。可以将牌从废牌或画面移至适当的底座。画面上的空白区域可以用任何其他牌填充。
<p>
可以将牌从发牌堆一次发到废牌牌。不允许重发。如果所有牌都移至牌堆，则游戏获胜。
