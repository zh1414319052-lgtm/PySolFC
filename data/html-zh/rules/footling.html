<h1>福特林</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
这些牌被发到八堆列牌堆上，其中四堆有七张牌，四堆有六张牌，全部面朝上。列牌堆是按红黑交替排列的，任何牌或有效的牌序列都可以在列牌堆之间移动。任何牌或序列都可以填满空堆。有四个空当，任何单张卡都可以移入/移出。
<p>
基础的建造方式类似于
<a href="fourbyfour.html">四乘四</a>。基础由相同等级的牌组成，从 A 开始。一旦该等级的所有四张牌都进入基础，您就可以将下一个等级的牌放在上面。
