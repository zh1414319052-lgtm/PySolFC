<h1>埃及的盗贼</h1>
<p>
经典接龙类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到十堆列牌堆上，每堆都有不同数量的牌，从左到右为 1-3-5-7-9-10-8-6-4-2。列牌堆是按颜色交替排列的，只有国王才能填充空的列牌堆。任何纸牌或有效的纸牌序列都可以在纸牌堆之间移动。
<p>
当没有剩余的棋步时，可以一次从画面中发一张牌，然后将其移动到画面或基础上。只允许重发一次。
<p>
基础是由从 A 到 K 的相同花色建立的。当所有牌都移至牌堆时，游戏获胜。
