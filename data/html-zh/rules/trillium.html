<h1>延龄草</h1>
<p>
蜘蛛型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按从 K 到 A 的完整顺序排列成列。

<h3>玩法规则</h3>
<p>
牌发到十三堆，每堆四张牌，面朝上和面朝下交替放置。列牌堆按红黑交替排列，任何牌或牌序列都可以在堆之间移动。
<p>
当没有剩余动作时，您可以从发牌堆顶部向每个列牌堆发一张牌。如果您能够将所有纸牌组织成从 K 到 A 的完整序列，则游戏获胜。
