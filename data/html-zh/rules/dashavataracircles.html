<h1>达沙瓦塔拉圆</h1>
Dashavatara Ganjifa类型。一层。不能重新发牌。
<h3>目标</h3>
将所有牌移到收牌区。
<h3>快速描述</h3>
这些牌在画面上按点数和花色依次排列。任何牌都可以打在空行上。一次只能移动一张卡。
<h3>玩法规则</h3>
游戏开始时，所有牌都发到三十二排。画面上的牌按照花色从高到低的顺序排列。基础是通过西装建立起来的。任何牌都可以打在空行上。备用堆各容纳一张牌。一次只能移动一张卡。
<h3>技巧</h3>
尝试保持备用堆打开。在空行上打出排名较高的牌。
