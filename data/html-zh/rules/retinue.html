<h1>随从</h1>
<p>
空当接龙类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="freecell.html">空当接龙</a>，但有 2 副牌，并且空行未填充。

<h3>玩法规则</h3>
<p>
游戏开始时所有牌都会发到 8 堆，每个 K 开始新的一堆。为了弥补这一点，有 8 个空当可以容纳任何卡（而且只能容纳一张卡）。
<p>
堆积物按不同颜色堆积，并且无法填充空白空间。
<p>
您可以作为序列移动的牌数受到可用单元数的限制 - 所需的可用单元数与使用单张牌进行等效移动序列时所需的可用单元数相同。
