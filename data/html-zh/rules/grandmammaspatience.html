<h1>奶奶的耐心</h1>
<p>
数值游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="grandfather.html">祖父</a>，但有二十二张列牌堆，所有从库存发的牌必须立即打到列牌堆或收牌堆上，还有四堆备用堆。
<p>
此外，在游戏开始时，一张牌会发到收牌堆。一组基础是从该等级开始按花色向下建立的，而另一组基础是从较高等级开始按花色建立的。基础桩根据需要从 A 到 K 环绕。
