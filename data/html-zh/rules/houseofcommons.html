<h1>下议院</h1>
<p>
蒙大拿州类型。 1 层剥离副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌按照从 2 到 10 的花色升序排列为 9 张牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="montana.html">蒙大拿州</a>，但只玩2到10张牌，并且只允许重发一次。
