<h1>盲目的耐心</h1>
<p>
四十大盗游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
画面中的所有牌都是面朝下发的。任何面朝下的牌都可以面朝下或翻转面朝上。面朝下的牌不能移动，但任何牌都可以打在面朝下的牌上。面朝上的牌一次可以移动一张，面朝上的牌可以通过红黑交替按顺序构建。
<p>
发牌堆上的牌被一次一张地扔进翻牌堆。您可以将最左边的牌移至游戏牌堆或牌堆上。不能重新发牌。
