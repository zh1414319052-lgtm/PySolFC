<h1>金字塔十三号</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="pyramid.html">金字塔接龙</a>，但除了金字塔前排以外的所有牌都面朝下发牌，并且不允许重新发牌。

<h3>补充说明</h3>
<p>
这个困难的 Pyramid 变体基于 Gnome AisleRiot 规则。那里被称为“十三”，但这里更名为金字塔十三以避免与游戏混淆
<a href="thirteens.html">十三号</a>.
<p>
<i>快速游戏</i> 此游戏已禁用。
