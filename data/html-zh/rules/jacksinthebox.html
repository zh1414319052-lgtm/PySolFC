<h1>盒子里的杰克</h1>
<p>
四十大盗类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="fortythieves.html">四十大盗</a>，但基础是从杰克到十建立起来的，必要时从国王到王牌。游戏开始时，只有六个列牌堆，每堆只发一张牌，而 J 则发到牌堆。
<p>
此外，还有四个空当。
