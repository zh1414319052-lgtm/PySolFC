<h1>海豚</h1>
<p>
高尔夫类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
这些牌被发到八堆列牌堆上，其中四堆有六张牌，四堆有七张牌。画面上不允许有任何建筑物。基础是按点数建立的，无论花色如何，根据需要从A到K。任何卡牌都可以用来启动基础。
<p>
按顺序将牌一次一张地从画面移到基础上。有四个空当。画面中的牌可以移动到它们，但从空当中，它们只能稍后移动到基础。如果所有的牌都能以一个连续的顺序移动到牌堆上，则游戏获胜。
