<h1>安抚奶嘴</h1>
<p>
四副牌游戏类型。 4 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
九个列牌堆各堆发五张牌。列牌堆是按点数递减的，无论花色如何，并且只有单张牌可以在列牌堆之间移动。只有国王才能填补空的列牌堆。
<p>
有一个空当最多可容纳 8 张牌。任何单张牌都可以移至备用区，最上面的牌可以移至基础或画面。
<p>
可以一次从画面中发一张牌，然后将其移动到画面、空当或基础上。基础是按照从 A 到 K 的花色建立起来的。如果所有牌都移至牌堆，则游戏获胜。
