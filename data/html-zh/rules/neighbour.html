<h1>邻居</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌堆。

<h3>玩法规则</h3>
<p>
目标是用完画面中的所有牌，将它们放在一个基础上。只有当两张牌的数值之和为 13 并且两张牌水平、垂直或对角接触时（即两张牌必须是 <i>邻居</i>).
<p>
您不必效仿。 Jack 值 11，Q 值 12。所有 K 都单独离开。
<p>
通过将牌向上移动并从爪牌发到底部牌堆，可以自动填充空白空间。
<p>
当列牌堆全部消失时，您就赢了。

<h3>补充说明</h3>
<p>
<i>快速游戏</i> 此游戏已禁用。

<h3>历史</h3>
