<h1>比斯利</h1>
<p>
贝克十二类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌分为十二堆，每堆四张，A 牌发到四个收牌堆。列牌堆是由相同花色向上或向下堆积的。牌可以在列牌堆之间一次移动一张。空的列牌堆无法被填充。
<p>
有两套基础 - 一套是从发牌前的 A 开始按花色建立的。另一种是按花色依次递减，从K开始。基础中的卡牌无法移动。
<p>
当所有牌都移至牌堆时，游戏获胜。每个基础中有多少张牌并不重要。
