<h1>策略</h1>
<p>
数值游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="numerica.html">点数组牌</a>，但有四个空当。发牌堆上的牌可以移至空闲格，而不是列牌堆，但每个空闲格只能容纳一张牌。牌可以从空当移至工作台或基础，但工作台上的牌不能移至空当。
