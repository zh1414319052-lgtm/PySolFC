<h1>波</h1>
<p>
育空类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌分为八堆，每堆三张牌，每堆中间的牌面朝下。列牌堆按颜色向下构建，无论顺序如何，都可以移动面朝上的牌，但面朝下的牌或上面有面朝下的牌的牌无法移动。任何牌或序列都可以移至空堆中。
<p>
当没有剩余动作时，您可以从发牌堆向每个列牌堆发两张牌，一张面朝下，一张面朝上。
<p>
基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
