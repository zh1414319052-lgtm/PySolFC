<h1>皇室联姻</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
移除红心国王和红心皇后之间的所有牌

<h3>玩法规则</h3>
<p>
红心皇后放在牌堆的顶部，而国王放在底部。
<p>
牌是按顺序从发牌堆发出的。如果两张牌之间有一张或两张相同点数或花色的牌，这些牌可能会被移除。
<p>
当红心国王被带到他的“新娘”即王后面前时，游戏就获胜了，就像他们之间的所有牌都被移除一样。

<h3>补充说明</h3>
<p>
Royal Marriage 及其相关游戏可以通过玩家一次手动发一张牌或一次发所有牌来玩。该选项可以在选项菜单中设置。
