<h1>三方联盟（2 副牌）</h1>
<p>
配对游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将除两张牌之外的所有牌移至同一个牌座上。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="triplealliance.html">三方联盟</a>，但有两副牌，每堆六张牌。另外，由于牌的数量不同，当剩下两张牌时，游戏就赢了。
