<h1>海王星</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将牌配对，直到清空发牌堆。

<h3>玩法规则</h3>
<p>
画面上发了八张牌。连续等级的成对牌可以被移除并丢弃到单个基础上，并且空间从发牌堆被填充。
<p>
如果发牌堆被清空，则游戏获胜。

<h3>补充说明</h3>
<p>
与大多数配对类型的游戏不同，您不需要将所有牌移动到基础上，因为从数学上来说这是不可能的。然而，在赢得游戏后，如果你点击“返回游戏”，通常可以再配对几张牌，最后只剩下四张牌。
<p>
<i>自动投放</i> 此游戏已禁用。
