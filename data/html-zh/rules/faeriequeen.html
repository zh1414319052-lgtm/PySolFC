<h1>精灵女王</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="saliclaw.html">萨利克定律</a>，但是皇后不是分开处理的，并且基础是从A到皇后建立的。此外，无论花色如何，您都可以按点数向下构建列牌堆，但只有在发牌堆空了的情况下才可以。
