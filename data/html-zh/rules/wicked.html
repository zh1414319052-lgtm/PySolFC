<h1>邪恶的</h1>
塔罗克型。 1 副牌。无限次重发。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
这个游戏类似于
<a href="cruel.html">残酷</a>
使用 78 张 Tarock 牌进行游戏。牌堆按花色依次递减。一次只能移动一张卡。

<h3>玩法规则</h3>
行按花色依次递减。一次只能移动一张卡。空行无法填充。当无法再进行任何操作时，请单击发牌堆以重新发牌。
