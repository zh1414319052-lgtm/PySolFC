<h1>拱门</h1>
<p>
两副牌游戏类型。 2 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
拱门是一个变体 <a href="ladyofthemanor.html">庄园夫人</a>，由大卫·帕莱特发明。玩法类似，只是画面中的所有牌都是可见的，并且基础的构建方式不同。前四个基牌各有一张 A，按花色加牌，而其他四个基牌则有一张 K，按花色加牌。
<p>
此外，备用堆中的每张牌都可以使用。点击重发按钮将移动每个备用区最上面的牌。
<p>
由于并非所有 A 都会发到基牌区，因此最左侧的第 13 个备用堆用于放置额外的 A。
