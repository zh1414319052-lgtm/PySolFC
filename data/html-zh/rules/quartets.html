<h1>四重奏</h1>
<p>
一层副牌类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌堆。

<h3>玩法规则</h3>
<p>
牌可以在列牌堆之间移动，一次移动一张牌。列牌堆通过红黑交替向上或向下构建。
<p>
有四个储备，每个可以容纳一张卡。如果所有四名预备队都持有相同等级的牌，则所有四名预备队都将移至收牌堆。当整副牌都以这种方式移至收牌堆时，游戏就获胜。
