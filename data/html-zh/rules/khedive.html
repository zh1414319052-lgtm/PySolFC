<h1>赫迪夫</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
画面上发了 24 张牌，分为五行，分别为 1、3、5、7 和 9 卡。画面上不允许有建筑物 - 画面中的牌只能移动到收牌堆上，收牌堆是由从 A 到 K 的相同花色建造的。空的列牌堆会立即从翻牌堆或发牌堆中填满。
<p>
当没有剩余动作时，您可以一次从发牌堆上发一张牌。如果所有牌都移至牌堆，则游戏获胜。
