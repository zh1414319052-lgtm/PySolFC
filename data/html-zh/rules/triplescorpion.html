<h1>三重蝎子</h1>
<p>
蜘蛛型。 3 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="scorpion.html">蝎子接龙</a>，但是有三副牌和十三堆，每堆十二张牌（五堆面朝下的五张牌）。
