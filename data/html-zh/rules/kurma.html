<h1>库尔玛</h1>
Dashavatara Ganjifa类型。一层。无限次重发。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
玩法类似于
<a href="klondike.html">经典接龙</a>。行按花色和等级排列。

<h3>玩法规则</h3>
画面上的牌按照相同花色的等级递减。从 A 开始，基础是按花色等级建立的。牌是从发牌堆上一次发一张。任何牌或可移动牌堆都可以在空行上打出。可以从基础开始打牌。

<h3>技巧</h3>
赢得这场比赛的可能性很高。首先尝试将最深的牌堆中的牌移走。
