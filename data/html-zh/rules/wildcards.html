<h1>通配符</h1>
<p>
被围困的城堡类型。 1 张小丑牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到十堆列牌堆上，第一堆包含一张牌，第二堆包含两张牌，依此类推，直到最后两堆包含九张牌。
<p>
列牌堆是通过颜色交替排列的，牌可以在列牌堆之间一次移动一张。基础是按花色建立的，从 A 开始。
<p>
布局中有两个王牌，是百搭牌。任何一张牌都可以打在小丑上，并且小丑可以打在任何牌堆上。小丑可以移动到第五个小丑基础，但前提是所有其他卡都已移动。
<p>
如果所有牌都移至牌堆，则游戏获胜。
