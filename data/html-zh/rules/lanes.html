<h1>车道</h1>
<p>
经典接龙类型。 1 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌发到六堆，每堆三张牌，A 发到牌堆。列牌堆是按红黑交替排列的，并且只能在列牌堆之间移动单张牌。任何卡牌都可以填充空的列牌堆。
<p>
当没有剩余的动作时，你可以一次从发牌堆上发一张牌，如果可能的话，将它们移动到画面或基础上。您可以重发一次，因此您可以浏览这副牌两次。
<p>
基础是由相同的花色建立的。如果所有牌都移至牌堆，则游戏获胜。
