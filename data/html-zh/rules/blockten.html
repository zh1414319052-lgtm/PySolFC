<h1>第十区</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
丢弃所有点数之和为 10 的牌对以及人头牌，只留下 4 个十。

<h3>玩法规则</h3>
<p>
画面中发了九张牌。总共十张的牌对可以被移除。人脸牌可以成对取出。十号无法被移除，因此他们在剩下的游戏中挡住了画面中的那个位置。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
