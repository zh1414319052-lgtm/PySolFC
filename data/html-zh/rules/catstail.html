<h1>猫的尾巴（Der Katzenschwanz）</h1>
<p>
空当接龙类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="snake.html">蛇</a>，但您可以按顺序移动的卡牌数量不受限制。

<h3>玩法规则</h3>
<p>
游戏开始时，所有牌都会发到 9 堆，每个国王开始新的一堆。为了弥补这一点，有 8 个空当可以容纳任何卡（而且只能容纳一张卡）。
<p>
堆积物按不同颜色堆积，并且无法填充空白空间。

<h3>历史</h3>
<p>
这是源自德国的纸牌变体。
