<h1>空位期</h1>
<p>
数值类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
八张牌发给八个备用牌，八张列牌堆各发一张牌。基础是通过无视花色的等级来建立的。每个收牌堆的起始点数都比其之上的储备高一级。
<p>
每个基础都必须使用其上方储备中的卡来完成。
<p>
列牌堆上没有建筑物 - 牌只能移动到收牌堆上，并且空间不会被填充。
<p>
当无法再移动时，单击发牌堆。每个游戏牌堆中都会添加一张牌。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
