<h1>温秀公开赛</h1>
<p>
花札型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有十二种花色按顺序排列。

<h3>玩法规则</h3>
<p>
这个游戏与
<a href="oonsoo.html"> 温秀 </a>
除非任何牌或正确排序的牌堆可以在空行上打出。

<h3>技巧</h3>
尝试保持一行对画布开放。
