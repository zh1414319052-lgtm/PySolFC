<h1>三十</h1>
<p>
一层游戏类型。 1 层剥离副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
三十牌的玩法只有 32 张牌，包括每种花色的 7 到 A。
<p>
三十张牌被发到六堆，每堆五张牌，其余两张牌留作备用牌。无论花色如何，列牌堆都是按点数向下叠放的，但只有相同花色的卡牌序列可以一起移动。备用牌可以随时移至适当的列牌堆或收牌堆中。
<p>
基础是由相同的花色建立的，从 A 开始。然后，在 A 上打 7，然后将其累积为 K。如果所有牌都移至牌堆，则游戏获胜。
