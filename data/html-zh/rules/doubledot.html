<h1>双点</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
八张牌被发到八个列牌堆，黑色 A 和红色 2 被发到基牌堆。列牌堆是按点数向下叠放的，无论花色如何，按其他等级构建，根据需要从 2 到 K 或 A 到 Q 到 Q。任何一张牌都可以填满空牌堆。
<p>
基础是由相同的花色、按其他等级建立的，并根据需要以相同的方式包裹。
<p>
当没有剩余手数时，可以从发牌堆向每个列牌堆发一张牌。如果所有牌都移至牌堆，则游戏获胜。
