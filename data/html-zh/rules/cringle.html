<h1>克林格尔</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到八堆，每堆五张牌。左边的四个列牌堆是按红黑交替向下搭建的，而右边四个列牌堆是按红黑交替搭建的。
<p>
有两套基础。左边的牌是按花色从 A 到 K 建立的，右边的牌是按花色从 K 到 A 建立的。每套基础都有一堆每种套装。
<p>
当没有剩余的动作时，您可以一次从发牌堆上发一张牌，并将它们移动到画面或基础上。不允许重发。如果所有牌都移至牌堆，则游戏获胜。
