<h1>帕格尼尼二世</h1>
<p>
蒙大拿州类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 A 到 K 的花色升序排列，每组 13 张牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="montana.html">蒙大拿州</a>，但对于两副牌，A 包含在发牌中，使每行最左边的位置空着，并且没有重发。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
