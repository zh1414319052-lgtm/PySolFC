<h1>斯卡普</h1>
<p>
经典接龙类型。 3 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="tripleklondike.html">三副经典接龙</a>，但所有牌都是面朝上发的，任何牌或序列都可以移到空牌堆中，并且不是从发牌堆中发单张牌，而是向每个列牌堆发一张牌。
