<h1>幸运十三</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到十三堆，每堆四张牌，排列成只有最上面的牌可见。列牌堆是按点数递减的，无论花色如何。只能在牌堆之间移动单张牌，空牌堆不能被填充。基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
