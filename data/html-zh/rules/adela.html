<h1>阿德拉</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
九个列牌堆每堆都会发一张牌。列牌堆由相同的花色组成，空的列牌堆会立即从发牌堆中填充。
<p>
收牌堆共有三排。第一行按花色依次排列，从 J 到 A。第二行只包含一个与上面的基础相同花色的 Q，第三行同样包含一个 K。在将 J 发到第一排之前，不能将牌移动到第二排或第三排基础。
<p>
当没有更多动作时，您可以从发牌堆上向九个列牌堆中的每一堆发一张牌。如果所有牌都移至牌堆，则游戏获胜。
