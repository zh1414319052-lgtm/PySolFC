<h1>八边形</h1>
<p>
四十大盗类型。 2 副牌。 3次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
位于游戏区角落的四个列牌堆各放五张牌。八张 A 被发给八个底座，每个底座都位于游戏区域的边缘。列牌堆是由相同的花色组成的。牌可以从发牌堆（放置在游戏区域的中间）一次发一张，并且可以移动到画面或基础上。允许重发三次。
<p>
基础是由相同的花色建立的。当所有牌都移至牌堆时，游戏获胜。
