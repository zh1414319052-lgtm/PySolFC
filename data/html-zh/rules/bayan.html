<h1>巴彦</h1>
<p>
一层副牌类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
取出所有牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="accordion.html">手风琴</a>，但是当你移动一堆牌时，两张牌都会被移除。
