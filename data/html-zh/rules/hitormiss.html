<h1>命中或错过</h1>
<p>
一层游戏类型。 1 副牌。重发次数不同。

<h3>目标</h3>
<p>
将所有牌移到收牌堆。

<h3>玩法规则</h3>
<p>当你从发牌堆上抽牌时，一次一张，按顺序声明牌的等级（从 A 到 K，然后从 A 开始）。如果抽到的牌与宣布的等级相符，则为“命中”，并且该牌可以移至基础。否则就是“小姐”了。您可以根据需要继续重新发牌多次，直到您连续两次浏览整副牌而没有获得一次“击中”。

<h3>补充说明</h3>
<p>
对于允许无限重发的变体（常见于其他纸牌应用程序中），请参阅 <a href="hitormissunlimited.html">命中或错过无限</a>.
