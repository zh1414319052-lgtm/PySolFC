<h1>风车接龙</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
角落里的 4 个底座按照从 King 到 Ace 的等级排列。
<p>
中心的收牌堆按从 A 到 K 的等级构建，环绕四圈，直到包含 52 张牌。
<p>
8 个备用堆可容纳一张牌，并自动从废牌或发牌堆中填充。
<p>
牌可以从发牌堆单独翻转到废纸区。不能重新发牌。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 和 <i>快速游戏</i> 已禁用此游戏。
