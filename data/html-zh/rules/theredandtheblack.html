<h1>红牌与黑牌</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
所有 A 都发到收牌堆。四个列牌堆和四个空当各发一张牌。列牌堆按红黑交替排列，只有最上面的牌可见。空当中的牌只能移动到画面上，并且纸牌只能从翻牌堆堆中移动到空当中。
<p>
当没有剩余的移动时，您可以一次从发牌堆上发一张牌，并将它们移动到画面、基础或空的空当中。不允许重新发牌。基础由 A 到 K 的红黑交替组成。如果所有牌都移至牌堆，则游戏获胜。
