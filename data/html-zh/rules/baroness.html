<h1>男爵夫人</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
目标是通过将所有卡牌放在一个基础上来用完它们。
<p>
从发牌堆到收牌堆，每次发五张牌。当发牌堆里只剩下两张牌时，它们会被放入两个备用堆中。
<p>
当两张牌的数值加起来为 13 时，即可消除成对的牌。Q 值 12，J 值 11。您不必跟风。
<p>
所有的国王都独自离开。

<h3>补充说明</h3>
<p>
<i>快速游戏</i> 此游戏已禁用。
