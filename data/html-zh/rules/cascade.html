<h1>级联</h1>
<p>
四十大盗类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到七堆，每堆五张牌。列牌堆是按颜色交替排列的，并且只能在列牌堆之间移动单张牌。还有两个空当，任何单张卡都可以自由移入/移出。
<p>
当没有剩余的移动时，您可以一次从发牌堆上发一张牌，并将它们移动到适当的画面/空当/收牌堆中。不允许重发，所以你只能通过发牌堆一次。
<p>
基础由 A 到 K 的红黑交替组成。如果所有牌都移至牌堆，则游戏获胜。
