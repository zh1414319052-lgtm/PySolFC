<h1>苏格兰耐心</h1>
<p>
粉丝游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
基础 <b>通过红黑交替构建</b>.
<p>
18 堆按点数递减，忽略花色。一次只能移动一张牌，空的牌堆不能被填充。
