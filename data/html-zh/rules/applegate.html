<h1>阿普尔盖特</h1>
<p>
蜘蛛游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 K 到 A 的花色降序排列，每组 13 张牌。

<h3>玩法规则</h3>
<p>
牌被发到七堆，每堆七张牌。第一堆牌全部面朝上，其余牌堆最下面的两张牌面朝下。剩下的三张卡被放置在备用卡中。
<p>
列牌堆是用相同的花色建造的。无论花色如何，成组的牌都可以在列牌堆之间移动。保留卡可以移至画面，但卡不能移至备用区。
<p>
当所有牌都被分成四个相同花色的序列（从 K 到 A）时，游戏就获胜。
