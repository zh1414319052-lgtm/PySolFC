<h1>十一三角形</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="triangle.html">三角形</a>，但总共 11 张牌被移除，并且相同等级的人头牌成对移除。此外，发牌堆上的牌会被发到三个翻牌堆（类似于 <a href="apophis.html">阿波菲斯</a>），无需重发。
