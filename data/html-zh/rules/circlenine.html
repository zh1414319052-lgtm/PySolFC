<h1>九圈</h1>
<p>
数值类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
一张牌被发到一个基础上，九张牌被发到围绕该基础的一圈列牌堆上。基础是按点数建立的，无论花色如何，根据需要从 K 转变成 A。
<p>
可以一次从发牌堆上发一张牌，然后移至接牌堆或列牌堆上。任何卡牌都可以移动到画面中，无论等级如何，但是一旦卡牌移动到画面中，它就只能移动到基础中。
<p>
如果所有牌都可以按顺序移至牌堆，则游戏获胜。
