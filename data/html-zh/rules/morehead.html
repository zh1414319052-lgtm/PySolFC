<h1>莫尔黑德</h1>
<p>
被围困的城堡类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>快速描述</h3>
<p>
就像 <a href="somerset.html">萨默塞特</a>，但是列牌堆可以用任何花色建造，除了他们自己的花色。
