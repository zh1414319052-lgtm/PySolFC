<h1>罐</h1>
<p>
被围困的城堡类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌将被发到四堆列牌堆上，每堆六张牌，以及四堆七张牌。列牌堆是按点数递减的，无论花色如何。任何适当的牌序列都可以在列牌堆之间移动。
<p>
收牌堆是按花色从 A 到 K 建立的。当所有牌都移至牌堆时，游戏获胜。
