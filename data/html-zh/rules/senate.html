<h1>参议院</h1>
<p>
拉格伦型。 2 副牌。没有重售。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
四个列牌堆和八个备用堆各发一张牌。 A 全部发到收牌堆。列牌堆是按相同花色依次排列的，任何纸牌或纸牌序列都可以在列牌堆之间移动。任何牌或序列都可以移动到空的列牌堆上。您不能在储备库上进行构建，并且卡牌一次只能从储备库移至画面或基础中。
<p>
当没有剩余手数时，您可以将牌堆中的一张牌发到每个备用堆上。
<p>
基础是按照从 A 到 K 的花色建立起来的。当所有牌都移至牌堆时，游戏获胜。
