<h1>国民</h1>
<p>
贝克十二类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
这副牌被分成十二堆，每堆八张牌。每个花色的 A 和 K 被移至基础。列牌堆是由相同花色向上或向下堆积的。列牌堆之间只能移动单张卡牌，并且可以移动任何卡牌来填充空的列牌堆堆。
<p>
以 A 开头的收牌堆是由相同花色组成的，而以 K 开头的收牌堆是由相同花色组成的。如果所有牌都移至牌堆，则游戏获胜。
