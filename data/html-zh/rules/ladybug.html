<h1>瓢虫</h1>
<p>
一层副牌类型。 1 副牌。重发次数不同。

<h3>目标</h3>
<p>
将四张牌移到七个列牌堆的每一堆中，每堆总共 10 张。

<h3>玩法规则</h3>
<p>
游戏开始时，七张牌会发到七个列牌堆上。发牌堆一次发三张牌。每发三张牌，最上面的一张必须移至列牌堆之一，然后才能再发三张牌。移动剩余的牌是可选的。
<p>
每堆列牌堆最多可包含 4 张牌。每个列牌堆的总数为 10。A 等于 1，人头牌的值为 0。十是百搭的，可以等于 0 到 10 之间的任何值。一旦打出，列牌堆中的牌就不能移动。游戏的目标是用四张牌组成每堆牌，总点数为 10。
