<h1>两环</h1>
<p>
两副牌游戏类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
填充所有基础。

<h3>玩法规则</h3>
<p>
乱七八糟的牌由两圈基础桩组成。八张牌被发到八个列牌堆上。 7 的基础是按照 K 的花色来建立的，而 6 的基础是按照 A 的花色来建立的。
<p>
画面上不允许有任何建筑物。当没有剩余动作时，可以从发牌堆向每个列牌堆发一张牌。当发牌堆空了时，所有的列牌堆都会被放置在一起以形成一个新的发牌堆。此操作只能进行一次。
<p>
当所有牌都移至两个环中的底座时，游戏获胜。
