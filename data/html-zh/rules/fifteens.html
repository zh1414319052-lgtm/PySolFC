<h1>凑十五</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
画面上发了十六张牌。等级为 9 或以下的成对牌，总共 15 张可以移至牌座，空间由发牌堆填充。总共 15 张的较大组牌也可以通过将它们全部移至特殊的备用堆中来丢弃。
<p>
十张牌和图片牌只能按每种类型一张牌的顺序移动。与较大的 15 张牌类似，通过将所有四张牌移至备用区来将其丢弃。
<p>
如果所有牌都被丢弃，则游戏获胜。

<h3>补充说明</h3>
<p>

<i>自动投放</i> 此游戏已禁用。
