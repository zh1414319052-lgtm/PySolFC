<h1>灯塔</h1>
<p>
一层游戏类型。 1 副牌。没有重售。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
牌被发到八堆，每堆四张牌。无论花色如何，列牌堆都是按点数递减的，并根据需要从 A 转为 K。任何纸牌或有效的纸牌序列都可以在列牌堆之间移动。如果列牌堆是空的，则从发牌堆向该列牌堆发一张牌。如果发牌堆是空的，则可以移动任何卡牌或序列来填充空的牌堆。
<p>
基础是按点数建立的，无论花色如何，根据需要从 K 转变成 A。任何一张牌都可以用来启动基础，当所有牌都移动到基础上时，游戏就赢了。
