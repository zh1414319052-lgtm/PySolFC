<h1>熊河</h1>
<p>
粉丝游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌分为十五堆，每堆三张牌和三堆每张两张牌。剩余的牌发到收牌堆。基础是按花色建立的，从发牌的等级开始，根据需要转动拐角（A 可以打到 King）。
<p>
列牌堆以相同花色向上或向下排列，但每个列牌堆内最多可放置 3 张牌。纸牌不能放入空的列牌堆中，除了以两张牌开头的三堆纸牌外 - 当这些纸牌为空时，任何纸牌都可以放入其中。
<p>
如果所有牌都移至牌堆，则游戏获胜。
