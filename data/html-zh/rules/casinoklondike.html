<h1>经典接龙赌场</h1>
<p>
经典接龙类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
就像 <a href="klondike.html">经典接龙</a>，但只有两次重发。

<h3>补充说明</h3>
<p>
这里有一个简单的赌场计分系统 - 每场游戏您借记 52 美元，每出一张卡，您将获得 5 美元的积分。每当您选择不同的游戏时，您的余额都会重置。加载的游戏和手动输入的游戏编号不算在内。
