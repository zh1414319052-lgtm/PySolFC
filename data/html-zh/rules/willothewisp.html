<h1>鬼火接龙</h1>
<p>
蜘蛛型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 K 到 A 的花色降序排列为 13 张牌组，并将这些牌组移至牌堆。

<h3>玩法简介</h3>
<p>
完全像 <a href="spiderette.html">小蜘蛛纸牌</a>，但由于布局不同，由七堆每堆三张牌组成，因此稍微容易一些。

<h3>历史</h3>
<p>
该游戏由阿尔伯特·H·莫尔黑德和杰弗里·莫特-史密斯发明。
