<h1>单纯形</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移动到牌座上。

<h3>玩法规则</h3>
<p>
九张牌被发到九个列牌堆上。工作台桩是按相同等级建造的。一旦所有四张相同等级的牌都进入列牌堆，该牌堆就可以移至牌堆。任何卡牌都可以移至空的工作列牌堆中。
<p>
一次可以从发牌堆发一张牌。不允许重发。如果所有牌都移至牌堆，则游戏获胜。
