<h1>三方联盟</h1>
<p>
配对游戏类型。 1 副牌。没有重售。

<h3>目标</h3>
<p>
将除一张牌之外的所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
牌以两到三堆的形式发牌。牌可以按照三个连续等级的顺序从画面中移除。转弯是允许的，因此 A 可以跟随 K，反之亦然。
<p>
序列是在一系列三个空当中叠放的，然后在序列完成后移动到基础上。当桌面上只剩下一张牌时，游戏获胜。
