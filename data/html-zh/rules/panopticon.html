<h1>圆形监狱</h1>
<p>
育空类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="tenacross.html">十横</a>，但有八堆，每堆六张牌（以类似的方式排列，外堆有五张面朝上的牌和一张面朝下的牌，中间堆有两张面朝上的牌，四张面朝下的牌），备用牌有四张。
