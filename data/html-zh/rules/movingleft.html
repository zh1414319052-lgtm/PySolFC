<h1>向左移动</h1>
<p>
经典接龙类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
游戏开始时，牌会发到十堆列牌堆上，第一堆有一张牌，第二堆有两张，依此类推。列牌堆是通过红黑交替来叠放的。牌可以移动到由相同花色组成的基础上，从 A 开始。
<p>
如果画面中的一堆牌被清空，则直接位于该列牌堆右侧的所有面朝上的牌都会被移动以填充空牌堆。如果其右侧没有牌，则列牌堆仍为空，可以用一张国王来填充。
<p>
牌每次从发牌堆发一张，并且可以移动到桌面或基础上。不允许重发。如果所有牌都移至牌堆，则游戏获胜。
