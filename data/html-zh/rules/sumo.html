<h1>相扑</h1>
花札型。 1 副牌。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
玩法类似于
<a href="freecell.html">空当接龙</a>。牌在画面上按花色从第一到第四排列，在基础上从第四到第一排列。只有第一排牌可以打在空行上。

<h3>玩法规则</h3>
牌在行上的等级逐渐降低，在基础上的等级逐渐提高。第三和第四等级（垃圾）卡不可互换。空行上只能打出第一张牌或顺序正确的牌堆。

<h3>技巧</h3>
不要在保留牌上打牌，除非它们可以被移除。
