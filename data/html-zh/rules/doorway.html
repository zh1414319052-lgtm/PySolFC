<h1>门口</h1>
<p>
经典接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
五个列牌堆各发一张牌。列牌堆是按点数递减的，无论花色如何。列牌堆之间只能移动单张牌，任何牌都可以填满空牌堆。基础是由从 A 到 K 的相同花色建立的。
<p>
有两个备用堆。一个只能包含一位国王，另一个只能包含一位王后。
<p>
当没有剩余的移动时，您可以一次从发牌堆上发一张牌，并将它们移动到画面、基础或备用区。不允许重新发牌。如果所有牌都移至牌堆，则游戏获胜。
