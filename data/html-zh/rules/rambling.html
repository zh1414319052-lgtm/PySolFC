<h1>漫布林</h1>
<p>
空当接龙类型。两个塔罗克副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="snake.html">蛇</a>，使用两副 78 张 Tarock 牌，并且您可以按序列移动的牌数不受限制。

<h3>玩法规则</h3>
<p>
游戏开始时，所有牌都会发到 9 堆，每个 King 或 Skiz 开始新的一堆。行按照等级和花色依次递减。王牌只会对其他王牌起作用。空行无法填充。八个空当各可容纳一张卡。
