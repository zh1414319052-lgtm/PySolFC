<h1>欣赏</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
就像 <a href="one234.html">一个234</a>，但您可以在画面中构建，无论花色如何，按点数下降，根据需要将角从 A 转为 K。前两堆向下建造 1 点，第二两堆向下建造 2 点，第三两堆向下建造 3 点，最后两堆向下建造 4 点。
<p>
空的牌堆可以用与最后一张牌相同等级的牌来填充，该牌将打到相同数量的基础上。
