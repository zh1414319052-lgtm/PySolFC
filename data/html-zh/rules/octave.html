<h1>八度</h1>
<p>
四十大盗类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌发到八堆，每堆三张牌，A 发到牌堆。列牌堆是按红黑交替排列的，并且只能在列牌堆之间移动单张牌。
<p>
牌从发牌堆上一次发一张，并且可以移到接牌堆或列牌堆上。当发牌堆空了时，可以将其翻转以进行第二次交易。在第二轮中，八张牌从发牌堆发到八个翻牌堆，然后发一张新牌来填充这些翻牌堆中的空牌堆。
<p>
收牌堆由相同花色组成，当所有牌都移至收牌堆时，游戏获胜。
