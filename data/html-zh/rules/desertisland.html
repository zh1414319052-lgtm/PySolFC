<h1>荒岛</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将除图片牌之外的所有牌移至牌座。

<h3>玩法规则</h3>
<p>
A 发到收牌堆。 24 个列牌堆中每堆都会发一张牌。画面上不允许建造，但空的列牌堆可以用另一堆顶部的一张卡牌填充。基础是由从 A 到 10 的相同花色建立的。 J、Q、K 不能移至底座。
<p>
当没有剩余的动作时，从发牌堆中向每个列牌堆发一张牌，排列成只有最上面的牌可见。如果所有 A 到 10 都移到了底牌上，则游戏获胜。
