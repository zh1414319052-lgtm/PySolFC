<h1>23 斯基杜</h1>
<p>
一层副牌类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将整个副牌压缩成两堆。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="accordion.html">手风琴</a>，但只有当牌被一张或两张牌分开时，您才可以移动牌，而不是当它们彼此相邻时。
<p>
因此，当只剩下两堆时，游戏就获胜（在这些规则下不可能只得到一堆）。
