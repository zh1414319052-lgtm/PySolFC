<h1>缅因猫</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌堆。

<h3>玩法规则</h3>
<p>
玩法类似于 <a href='tabbycat.html'>虎斑猫</a>, but with 2 decks and 8 foundations.
