<h1>轻松的堆积</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
重新排列牌，使每堆包含四张具有相同等级的牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="pileon.html">堆上</a>，但添加了一个备用单元 - 可以随时将单张卡移入或移出该备用单元。
