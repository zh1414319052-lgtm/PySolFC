<h1>元帅</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
二十四堆列牌堆中每堆都会发一张牌。列牌堆按相同花色上下排列，放置的牌只显示最上面的一张。空的列牌堆会立即从发牌堆填充。如果库存为空，则无法填充列牌堆。
<p>
如果没有剩余手数，您可以从发牌堆发一张牌到所有 24 堆。
<p>
有两套基础 - 左边的一套由相同的花色从 A 到 K 组成，而右边的一套由相同的花色从 K 到 A 组成。牌可以在收牌堆之间移动。如果所有牌都移至牌堆，则游戏获胜。
