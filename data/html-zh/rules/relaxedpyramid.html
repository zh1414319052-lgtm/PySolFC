<h1>宽松金字塔</h1>
<p>
配对游戏类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
移除金字塔中的所有卡牌。

<h3>玩法简介</h3>
<p>
就像 <a href="pyramid.html">金字塔接龙</a>，但是一旦金字塔被清除，你就赢了。

<h3>补充说明</h3>
<p>
<i>快速游戏</i> 此游戏已禁用。
