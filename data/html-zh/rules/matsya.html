<h1>马齐亚</h1>
Dashavatara Ganjifa类型。一层。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
玩法类似于
<a href="klondike.html">经典接龙</a>。这些行仅按点数向下构建。

<h3>玩法规则</h3>
无论花色如何，画面上的牌都会按点数递减。从 A 开始，基础是按花色等级建立的。牌是从发牌堆上一次发一张。不能重新发牌。只有大鹏（国王）可以在空排上比赛。牌不能从基础开始打。

<h3>技巧</h3>
垃圾堆将是最大的问题区域。先从它开始玩吧。
