<h1>角落套房</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌每次从发牌堆发一张，并且可以移动到九个列牌堆之一，这些列牌堆按点数向下排列，无论花色如何，只有最上面的牌可见。虽然单张牌可以在列牌堆之间移动，但空牌堆只能从翻牌堆中填充。不允许重发。
<p>
收牌堆位于游戏的角落，由从 A 到 K 的相同花色组成。如果所有牌都移至牌堆，则游戏获胜。
