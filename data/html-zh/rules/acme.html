<h1>埃克梅</h1>
<p>
坎菲尔德类型。 1 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
4 张牌发到 4 个列牌堆，13 张牌发到备用堆。 A 会发到四个接龙堆上。
<p>
列牌堆是由相同的花色组成的。单张牌可以在列牌堆之间移动，也可以将备用牌移至列牌堆。空的列牌堆会立即从储备区填满。基础是由从 A 到 K 的相同花色建立的。
<p>
可以从发牌堆上一次发一张牌。这些卡牌可以移至桌面或接龙堆中。您可以重交易一次，因此您可以两次浏览该股票。
<p>
当所有牌都移至牌堆时，游戏获胜。
