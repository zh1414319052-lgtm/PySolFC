<h1>格兰特的强化</h1>
<p>
两副牌游戏类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="alhambra.html">阿罕布拉</a>，但备用牌包含四堆，每堆有 12 张牌，并且从牌堆中向任何空的备用堆发一张牌。
