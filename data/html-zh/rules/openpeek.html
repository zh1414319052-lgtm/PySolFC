<h1>打开查看</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
就像 <a href="osmosis.html">渗透接龙</a>，但各行是面朝上发的，而这副牌的其余部分是面朝上发的，作为备用牌，可以随时移到牌堆上。
