<h1>弗雷德的蜘蛛</h1>
<p>
蜘蛛型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌发到十堆，每堆五张牌，所有牌面朝上。无论花色如何，列牌堆都是按点数向下叠放的，但只有单张牌或相同花色的序列可以在列牌堆之间移动。任何牌或序列都可以填充空堆。
<p>
当没有剩余手数时，可以从发牌堆向每个列牌堆发一张牌。
<p>
基础是由从 A 到 K 的相同花色建立的。当所有牌都移至牌堆时，游戏获胜。

<h3>补充说明</h3>
弗雷德的蜘蛛是弗雷德·伦德发明的蜘蛛变种。
