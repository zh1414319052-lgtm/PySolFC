<h1>俘虏皇后</h1>
<p>
一层游戏类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌每次从牌堆中发一张，并且可以移动到三排牌座之一。最上面一排的基础是按相同花色从 5 到 A 叠放的，然后在 A 上打 K。底排的基础是由从六到杰克相同的花色组成的。中间一排基础正好包含每种花色的皇后。
<p>
允许重发两次。如果所有牌都移至牌堆，则游戏获胜。

<h3>补充说明</h3>
游戏的名称来源于皇后被其他收牌堆包围的事实。
