<h1>帕格尼尼</h1>
<p>
蒙大拿州类型。 1 层剥离副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌按照花色从“二”到“K”的升序排列为一组 12 张牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="bluemoon.html">蓝月亮</a>，但从牌堆中删除二到五，并在 A 后打六，仅重发一次。
