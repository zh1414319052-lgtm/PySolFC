<h1>美丽露西</h1>
<p>
粉丝游戏类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
18 桩按花色依次递减。一次只能移动一张卡。空堆不会被填满。
<p>
当无法再移动时，单击发牌堆。桌面上的所有牌都将重新洗牌。

<h3>历史</h3>
<p>
该游戏也被称为
<i>三叶草叶</i> 和 <i>午夜油</i>.
