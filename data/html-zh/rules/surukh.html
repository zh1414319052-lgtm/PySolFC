<h1>苏鲁克</h1>
Dashavatara Ganjifa类型。一层。不能重新发牌。
<h3>目标</h3>
将所有牌移到收牌区。
<h3>快速描述</h3>
画面上的牌按点数依次排列，每排不超过十二张。只有 Rajas 可以在空排上进行。
<h3>玩法规则</h3>
游戏开始时，所有牌都会发到十六排。画面上的卡牌以交替的力量逐渐按点数递减。见一般
<a href="../ganjifa.html">赶集发</a>
规则以获取更多信息。记住一套衣服的力的简单方法是，左边的基础是一种力，右边的基础是另一种力。基础是通过西装建立起来的。任何牌或序列都可以在空行上打出。
<h3>技巧</h3>
尝试一个空行。
