<h1>上下</h1>
<p>
配对游戏类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="pyramid.html">金字塔接龙</a>，但是有两副牌，牌被排列成两个金字塔，类似于 <a href="twopyramids.html">两个金字塔</a>，但有一个倒置类似于 <a href="triangle.html">三角形</a>.
