<h1>好措施</h1>
<p>
贝克十二类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="bakersdozen.html">贝克的十几个</a>，但 10 堆和 2 个 A 在游戏开始时被移至牌堆。
