<h1>王牌向上 5</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将除四张 A 之外的所有牌移动到单一的基础上。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="acesup.html">四张A</a>，但有五堆。很容易。

<h3>补充说明</h3>
<p>
有五堆牌，但只有四套花色，所有交易最终都会兑现。虽然还是很满足。
