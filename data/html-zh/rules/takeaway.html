<h1>带走</h1>
<p>
高尔夫类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移动到牌堆上。

<h3>玩法规则</h3>
<p>
这些牌被分成四叠，每叠有 13 张面朝上的牌。卡牌可以一次移动到六个基础之一。任何卡牌都可以用来启动其中一个收牌堆，但之后，收牌堆会按点数向上或向下的顺序建造。转弯是允许的，因此 A 可以打在 K 上，反之亦然。
<p>
您不得在工作台堆栈之间移动牌。
<p>
如果您将所有牌都放到了牌堆上，您就赢了。
