<h1>四风</h1>
<p>
一层游戏类型。 1 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
A 发到收牌堆，每种花色的两张 A 分别位于发牌堆的不同一侧。四张牌被发给每个收牌堆旁边的空当。
<p>
牌一次从发牌堆发出一张。发牌堆里的牌可以移动到空当或收牌堆。移动初始牌后，只有与相邻基础相同花色的牌才能移回这些单元格。只允许重发一次。
<p>
基础是由同一套衣服建立起来的。如果所有牌都移至牌堆，则游戏获胜。
