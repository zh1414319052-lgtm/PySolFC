<h1>淘汰赛</h1>
<p>
一层副牌类型。 1 层剥离副牌。 2次重做。

<h3>目标</h3>
<p>
将所有球杆移至收牌堆。

<h3>玩法规则</h3>
<p>淘汰赛的牌组只有 32 张牌，包括每种花色的 7 至 A。
<p>
从发牌堆到三个列牌堆，每次发三张牌。任何俱乐部都可以移至收牌堆。当一张牌被移动到基础时，另一张牌会从发牌堆中发出来取代它。
<p>
在从发牌堆上发完五组牌后，用发牌堆的剩余部分将列牌堆洗牌，以在继续之前创建一个新的发牌堆。此操作最多可以进行两次。
<p>
如果所有球杆都移至收牌堆，则游戏获胜。
