<h1>十字路口</h1>
<p>
四十大盗类型。 4 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="junction.html">交界处</a>，但有四副完整的牌，以及七个列牌堆，每堆七张牌，每堆的第二张、第四张和第六张牌面朝下发。基础桩是从 A 到 K 建立的。
