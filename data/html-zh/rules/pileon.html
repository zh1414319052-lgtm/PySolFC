<h1>堆上</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
重新排列牌，使每堆包含四张具有相同等级的牌。

<h3>玩法规则</h3>
<p>
重新排列牌，使每堆包含四张具有相同等级的牌。这应该留下两堆空的。
<p>
卡牌可以移动到任何其他卡牌或相同等级的卡牌之上。如果牌组的等级相同，则可以移动它们。
<p>
一堆牌不能超过四张，空位可以用任何一张或一组具有相同等级的牌填充。

<h3>技巧</h3>
<p>
尽可能保持其中一堆干净。不要允许在单张牌之上堆积三张牌，特别是当该组中的最后一张牌不是另一堆牌中的底部牌时。
