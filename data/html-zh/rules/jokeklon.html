<h1>笑话克隆</h1>
<p>
经典接龙类型。 1 张小丑牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="klondike.html">经典接龙</a>，但是有小丑。任何牌或序列都可以打在小丑上，小丑也可以打在任何牌或序列上，或者空白处。一旦所有其他牌都被移到了牌堆上，小丑就可以被移到他们的牌堆上。
<p>
法式套牌的变体 <a href="hexaklon.html">六角克隆</a>.
