<h1>角落里的猫</h1>
<p>
数值类型。 1 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
四个基点放在一个方格内，每个基点各发一张 A。从 A 到 K，底座都是用相同的颜色建造的。
<p>
纸牌一次从发牌堆上发一张，并且可以发到游戏区域角落的四个列牌堆之一或适当的基础上。移至列牌堆的卡牌只能移至接牌堆。如果发牌堆是空的，则可以将这四堆组合起来制成新的发牌堆。此操作只能进行一次。
<p>
当所有牌都移至牌堆时，游戏获胜。
