<h1>钟乳石</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
基础是按点数建立的，忽略颜色和花色，从国王到王牌。基本等级在初始交易时确定。
<p>
列牌堆上没有建筑物，空间也没有被填满。只有最上面的牌可以移动。
<p>
两个空当可以容纳任何卡，而且只能容纳一张卡。
