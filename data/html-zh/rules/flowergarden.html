<h1>花园接龙</h1>
<p>
拉格伦型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到六列，每列六张牌。各个柱子被称为花坛，整个画面被称为花园。另外十六张牌被放置在称为花束的储备中。
<p>
花坛是按照等级依次建造的，不分花色。花坛之间只能移动单张牌，任何牌都可以填充空白区域。花束中的牌可以移至花园或收牌堆，但牌不能移至花束中。
<p>
基牌是按花色从 A 到 K 建立的，如果所有牌都移到基牌上，则游戏获胜。
