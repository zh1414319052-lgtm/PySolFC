<h1>蜂巢</h1>
<p>
坎菲尔德类型。 1 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移到收牌堆。

<h3>玩法规则</h3>
<p>
六堆列牌堆形成“花园”，还有十三张牌储备，称为“蜂巢”。
<p>
画面/花园中的桩是按同一等级建造的。一旦所有四张相同等级的牌都进入列牌堆，该牌堆就可以移至牌堆。如果列牌堆是空的，则将备用区/蜂箱中的顶牌发到其位置。如果备用牌是空的，则可以从列牌堆或翻牌堆中发出任何牌来代替它。
<p>
牌可以一次从发牌堆发三张，并且可以在列牌堆上打出。备用区/蜂箱的顶牌也可以移动到匹配的列牌堆上。
<p>
当所有牌都匹配并移至牌堆时，游戏获胜。
