<h1>雷切尔</h1>
<p>
蜘蛛型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 K 到 A 的花色降序排列，每组 13 张牌，并将这些牌移至收牌堆。

<h3>玩法规则</h3>
<p>
无论花色如何，牌都是按顺序排列的。任何牌或合法的牌组都可以填充空格。
<p>
目标是将牌分成 13 张牌组，从 K 到 A 都是相同花色的。这些团体可以转移到收牌堆。
<p>
当您点击发牌堆时，一张卡牌会被翻到翻牌堆上。不能重新发牌。
