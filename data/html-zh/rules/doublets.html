<h1>双峰</h1>
<p>
一层游戏类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将除四张国王之外的所有牌移至单一牌堆。

<h3>玩法规则</h3>
<p>
八叠牌各发一张，呈方形排列。最下面的桩是基础，其余七桩是备用。
<p>
基础的基本等级是在游戏开始时确定的，它是通过将等级加倍而建立的，忽略花色：
<p>
A、2、4、8、3、6、Q、J、9、5、10、7、A、重复...
<p>
7 个备用堆会自动用翻牌堆或发牌堆填充。
<p>
K 处于阻挡状态，因此游戏开始时前 8 张牌中的所有 K 都被放在发牌堆的底部。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
