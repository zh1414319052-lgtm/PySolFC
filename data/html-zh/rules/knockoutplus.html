<h1>淘汰赛+</h1>
<p>
一层副牌类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有球杆移至收牌堆。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="knockout.html">淘汰赛</a>，但如果是一副完整的牌，则每次重发会发八行牌。
