<h1>伊姆加德</h1>
<p>
吉普赛类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="gypsy.html">吉普赛人</a>，但有 9 堆，并且只有 K 位于空位上。

<h3>玩法规则</h3>
<p>
列牌堆按颜色交替排列，空白区域只能由国王或以国王开始的序列来填充。
<p>
当无法再移动时，单击发牌堆。除最后一回合仅发 7 张牌外，每个列牌堆中都会添加一张牌。
<p>
您还可以将牌移出牌堆。

<h3>补充说明</h3>
<p>
与 Gypsy 一样，您可以大量使用 Undo 键。
