<h1>河内序列</h1>
<p>
河内塔游戏类型。 9张卡。不能重新发牌。

<h3>目标</h3>
<p>
按顺序构建一堆包含所有 9 张牌的牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="towerofhanoy.html">汉诺塔</a>，但是向下堆放 <b>按顺序</b>.

<h3>玩法规则</h3>
<p>
一张卡只能放置在另一张等级更高的卡上。
<p>
只能移动最上面的卡，并且可以用任何单张卡填充空间。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
