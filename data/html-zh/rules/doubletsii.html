<h1>双峰II</h1>
<p>
配对类型。 1 副牌。没有重售。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
牌发到十二堆，每堆四张牌，每堆只有最上面的牌面朝上。画面中相同等级的成对暴露牌可以移至牌堆。空的列牌堆可以用发牌堆上剩余的四张牌中的一张来填充。如果所有卡牌都能配对，您就赢了。

<h3>补充说明</h3>
<p>
本游戏与本游戏无关 <a href="doublets.html">双峰</a> 除了名字相似之外。
