<h1>克里比奇接龙Ⅱ</h1>
<p>使用 1 副牌，不能重新发牌。</p>
<h3>目标</h3>
<p>完成四轮发牌，累计得到至少 80 分。</p>
<h3>玩法规则</h3>
<ol>
<li>先发第一组 6 张手牌，附加牌组一开始为空。从手牌中选 2 张放进去。</li>
<li>接着发第二组 6 张手牌。从第二组中再选 2 张，补齐附加牌组。</li>
<li>以同一张起始牌，分别给两组手牌及附加牌组计分。</li>
<li>每局共发四轮，累计达到 80 分即获胜。</li>
</ol>
<p>各组按<a href="cribbagepatience.html">克里比奇接龙的计分方法</a>计分。</p>
