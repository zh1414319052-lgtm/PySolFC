<h1>魔术蒙大拿州</h1>
<p>
六角 A 副牌类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌按花色从 1 到 16 升序分组，每组 17 张牌，每行末尾有一个向导。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="montana.html">蒙大拿州</a>，但带有六角 A 副牌。初始列被处理为空，序列从 1 到 16 构建。巫师是狂野的，可以自由移动到任何地方，除了紧跟在另一个巫师或空白区域之后。最终，在比赛结束时，奇才队必须位于最右边的一列，靠近 10 号。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
