<h1>阿什拉菲</h1>
莫卧儿甘吉法型。一层。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
玩法类似于
<a href="freecell.html">空当接龙</a>。这些行仅按点数递减，每行最多不超过十二行。

<h3>玩法规则</h3>
画面上的牌无论花色如何，都按点数递减。一排最多只能放置十二张牌。收牌堆下方的四个备用堆各持有一张牌。从 A 开始，基础是按花色等级建立的。只有大鹏（国王）可以在空排上比赛。

<h3>技巧</h3>
移动工作牌，目标是首先释放 A。尽可能保持备用堆打开。在大鹏上堆起一堆堆，这样它们就可以移动到空的行上。
