<h1>乌斯克</h1>
<p>
经典接龙类型。 1 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>快速描述</h3>
<p>
就像 <a href="somerset.html">萨默塞特</a>，但牌序列可以移动，只有国王可以填补空牌堆，并且允许重发一次。通过这次重发，画面上所有剩余的牌都会被洗牌，并发出新的画面。
