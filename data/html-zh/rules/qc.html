<h1>丘西接龙</h1>
<p>
经典接龙类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到六堆，每堆四张牌。列牌堆是用相同的花色建造的。列牌堆之间只能移动单张牌。空白的空间会立即从翻牌堆中填充，但如果库存是空的，任何牌都可以填充空的列牌堆。
<p>
您可以一次从发牌堆发一张牌，然后将牌移动到画面和基础上。只允许重发一次。
<p>
基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
