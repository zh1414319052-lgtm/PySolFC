<h1>克里比奇方阵</h1>
<p>使用 1 副牌，不能重新发牌。</p>
<h3>目标</h3>
<p>将 16 张牌摆进 4×4 方阵。每横行、每纵列各计一组，共八组。总分达到 61 分即获胜。</p>
<h3>玩法规则</h3>
<ul>
<li>依次翻牌，将牌放进空格。放进方阵后就不能再移动。</li>
<li>带备用格的变体有 1 个或 2 个备用格，每格最多放 5 张牌。各格顶牌可以随时移入方阵。</li>
<li>带弃牌堆的变体允许把牌弃入该堆，弃下的牌不能再取回。</li>
<li>方阵填满后再翻出一张起始牌。每组以自己的 4 张牌和这张起始牌计分。起始牌不能移到备用格或弃牌堆。</li>
</ul>
<p>各组按<a href="cribbagepatience.html">克里比奇接龙的计分方法</a>计分。</p>
