<h1>双尤因塔</h1>
<p>
高尔夫类型。 2 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移至收牌堆。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="uintah.html">尤因塔</a>，但有两副牌和八个粉底——每种花色各两个，每种颜色四个。
