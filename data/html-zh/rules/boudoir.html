<h1>闺房</h1>
<p>
两副牌游戏类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
收牌堆排列成四行。第一行按花色从 A 到 K 排列。每套花色中的一张 Q 发到第二排。第三行只能包含每种花色的 J，而底行则按花色从 10 到 K，从 A 到 K 依次排列。
<p>
牌从发牌堆上一次发一张，并且可以移动到适当的基础上。如果所有牌都移至牌堆，则游戏获胜。
