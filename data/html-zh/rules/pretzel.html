<h1>椒盐卷饼</h1>
<p>
蒙大拿州类型。 1 层剥离副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 2 到 5 的花色升序排列为 4 张牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="montana.html">蒙大拿州</a>，但只玩2到5张牌，并且不允许重发。
