<h1>大易</h1>
花札型。 2 副牌。无限次重发。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
这是双层版本
<a href="littleeasy.html">小容易</a>。相同花色的行按点数递减。收牌堆是用相同等级的牌按花色顺序建造的。只有第一排牌可以打在空行上。

<h3>玩法规则</h3>
规则与中相同
<a href="littleeasy.html">小容易</a>.

<h3>技巧</h3>
禁用自动放置并在行上构建，直到所有牌都面朝上。这些游戏可能听起来很简单，也很容易玩，但要赢却并不容易。
