<h1>丘吉尔</h1>
<p>
吉普赛类型。 2 副牌。没有重售。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
基础是按照从 A 到 K 的花色建立的。
<p>
列牌堆按颜色交替排列，空白区域只能由国王或以国王开始的序列来填充。
<p>
当您点击发牌堆时，每堆牌都会打出一张牌，但以 K 开头的单个序列的牌堆除外。
<p>
棋盘顶部“恶魔六人组”的牌只能直接移至牌堆，并且必须按堆叠顺序打出。
