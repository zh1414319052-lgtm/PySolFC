<h1>右和左</h1>
<p>
配对游戏类型。 2 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
一次从发牌堆发两张牌。相同等级的成对牌可以移至牌堆。一旦库存空了，两堆就会翻转并创建新的库存。
<p>
一旦所有牌都移至牌堆上，游戏就获胜。允许无限次重发，因此所有游戏​​最终都会结果。
