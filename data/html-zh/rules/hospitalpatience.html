<h1>医院耐心</h1>
<p>
一层游戏类型。 1 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移至牌堆。

<h3>玩法规则</h3>
<p>
发牌堆每次发三张牌，并且可以移动到牌堆上。允许无限次重发。共有八个基础，其中四个按花色从 A 到 K 建立，四个按花色从 K 到 A 建立。如果所有牌都移到了牌堆上，则游戏获胜 - 无论每个牌堆中有多少张牌都没有关系。
