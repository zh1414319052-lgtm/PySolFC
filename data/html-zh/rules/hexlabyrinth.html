<h1>六角迷宫</h1>
<p>
空当接龙类型。两个六角 A 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="snake.html">蛇</a>，与 <a href="../hexadeck.html">六角A副牌</a> 您可以按序列移动的牌的变化和数量不受限制。

<h3>玩法规则</h3>
<p>
游戏开始时，所有牌都会发到 9 堆，每张 K 或“十”（十六进制）开始新的一堆。行按点数和红黑交替排列。奇才队可以选择任何颜色。空行无法填充。
