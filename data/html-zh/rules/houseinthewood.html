<h1>树林里的房子</h1>
<p>
粉丝游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
34 个列牌堆各发三张牌，第 35 个列牌堆拥有剩余两张牌。列牌堆按相同花色上下排列，并且只能在牌堆之间移动单张牌。空的列牌堆无法被填充。
<p>
基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
