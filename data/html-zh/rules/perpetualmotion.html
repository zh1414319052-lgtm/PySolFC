<h1>永动机</h1>
<p>
一层游戏类型。 1 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
牌从发牌堆发到画面上，一次发四张。列牌堆由以下人员建造 <b>相同等级的卡牌</b>.
<p>
一堆四张相同等级的牌可以移动到单一的基础上。
<p>
发完所有牌后，单击发牌堆即可重新发牌。牌不会重新洗牌，而是以某种模式重新发牌。这些堆被堆叠在一起，最右边的一堆翻转并放在底部，其他每一堆翻转并放在顶部，从右到左。
<p>
如果所有牌都移至牌堆，则游戏获胜。

<h3>技巧</h3>
<p>
适合无意识地玩，因为迟早每场比赛都会出来。
