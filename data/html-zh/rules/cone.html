<h1>锥体</h1>
<p>
吉普赛类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="gypsy.html">吉普赛人</a>，但有七个列牌堆，中间一张有四张牌，左右各堆各少一张（所有牌都面朝上发）。此外，如果有空牌堆，则无法从发牌堆上发牌。
<p>
此外，当发牌堆里只剩下四张牌时，它们可以直接发到四个备用堆，并在可能的情况下自由移动到画面或基础上。
