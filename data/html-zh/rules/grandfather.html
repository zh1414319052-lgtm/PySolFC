<h1>祖父</h1>
<p>
数值类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
二十张牌发到二十堆。
<p>
画面中的牌可以移至基础中。左边的四个基础是按照花色从 A 到 K 建立的，而右边的四个基础是按照花色从 K 到 A 建立的。
<p>
牌每次从发牌堆发一张，并且可以移至列牌堆或收牌堆中。虽然每个列牌堆最多只能有两张牌。牌不能在列牌堆之间移动，空的牌堆会立即从发牌堆填充。允许单次重发。
<p>
如果所有牌都移至牌堆，则游戏获胜。
