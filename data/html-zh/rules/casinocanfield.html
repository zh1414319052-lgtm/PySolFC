<h1>坎菲尔德赌场</h1>
<p>
坎菲尔德类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
就像 <a href="canfield.html">坎菲尔德</a>，但牌是从发牌堆上一次发一张，并且不会重发。

<h3>补充说明</h3>
<p>
这里有一个简单的赌场计分系统 - 每场游戏您借记 52 美元，每出一张卡，您将获得 5 美元的积分。每当您选择不同的游戏时，您的余额都会重置。加载的游戏和手动输入的游戏编号不算在内。
<p>
坎菲尔德赌场试图重现理查德·A·坎菲尔德赌场中玩的游戏，尽管该游戏可能实际上是 <a href="vegasklondike.html">经典接龙的变体</a>.
