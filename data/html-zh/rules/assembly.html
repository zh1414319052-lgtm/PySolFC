<h1>集合接龙</h1>
<p>
数值游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
开局向 4 个列牌堆各发 1 张牌。列牌堆按点数递减叠牌，花色不限。列牌堆之间只能移动单张牌，空列只能用翻牌堆的牌补上。
<p>
从发牌堆逐张翻牌。翻牌堆里的牌可以移到列牌区或收牌区。
<p>
收牌堆从 A 开始按点数递增收牌，花色不限。
