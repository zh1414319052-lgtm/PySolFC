<h1>日本花园</h1>
花札型。 1 副牌。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>玩法规则</h3>
这是一个 <a href="fan.html">风扇</a>
适合 Hanafuda 卡的类型游戏。画面由上方两排的六个花坛和下方的锦鲤池组成，收牌堆位于顶部。牌在画面上按花色从第一到第四排列，在基础上从第四到第一排列。只有第一排牌可以打在空行上。连续打出的牌不得超过六张。卡牌可以从锦鲤池移至行或收牌堆，但不能移至池塘。一次只能移动一张卡。

<h3>技巧</h3>
将牌放到收牌堆上后就无法采取行动的情况并不罕见。尝试获得一个空行。
