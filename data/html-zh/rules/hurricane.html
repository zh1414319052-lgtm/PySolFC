<h1>飓风</h1>
<p>
配对类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
牌被发到十堆，每堆三张牌，以及另外三张单牌。将点数总计为 14 的牌配对，并将其弃置到牌堆上。三张单张牌中的牌会从发牌堆替换，但三叠牌在清空后不会被替换。
<p>
A 的值为 1，J 的值为 11，Q 为 12，K 为 13。
<p>
如果所有牌都被丢弃到牌堆上，则游戏获胜。

<h3>补充说明</h3>
<p>

<i>自动投放</i> 此游戏已禁用。
