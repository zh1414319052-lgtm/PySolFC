<h1>片状</h1>
<p>
高尔夫类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
牌被发到六堆工作牌中，其中两堆有八张牌，四堆有九张牌。列牌堆可以按点数向上或向下构建，无论花色如何，并且只能在堆之间移动单张牌。任何一张卡牌都可以填满空的列牌堆。
<p>
只有一个基础，无论花色如何，都按点数向上或向下建立。如果所有牌都按顺序移动到该基础上，则游戏获胜。
