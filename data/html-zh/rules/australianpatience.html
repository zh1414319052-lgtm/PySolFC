<h1>澳大利亚人的耐心</h1>
<p>
育空类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
这些牌被分成七堆，每堆三张牌。画面中的牌是按相同花色排列的 - 成组的牌可以移动，无论顺序如何，并且只有 K 可以用来填充空牌堆。
<p>
牌从发牌堆上一次发一张，并且可以移动到基础或画面上。不允许重发。
<p>
基础是按照从 A 到 K 的花色建立起来的。当所有牌都移至牌堆时，游戏获胜。
