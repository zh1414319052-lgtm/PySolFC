<h1>凝乳和乳清</h1>
<p>
蜘蛛型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移动到画面上，分成四列，并具有从 K 到 A 的完整顺序。

<h3>玩法规则</h3>
<p>
牌发到十三堆，每堆四张牌。列牌堆是按相同花色或等级建造的。任何纸牌或有效的纸牌序列都可以移动，但是包含相同点数或花色的组的组合序列不能移动。
<p>
只有国王或以国王开头的序列才能移至空的列牌堆。如果所有牌都可以排列成从 K 到 A 的四个相同花色顺序，则游戏获胜。
