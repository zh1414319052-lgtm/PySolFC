<h1>尤拉利亚</h1>
花札型。 1 副牌。无限次重发。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
玩法类似于
<a href="paulownia.html">泡桐</a>。各行按相同花色依次排列。基础是按花色等级建立的。

<h3>玩法规则</h3>
行按花色从第一级到第四级排列。基础从第四层到第一层建立。第三和第四等级（垃圾）卡在画面上不可互换。牌不能从基础开始打。任何牌或顺序正确的牌堆都可以在空行上打出。

<h3>技巧</h3>
首先发现最深的列牌堆。
