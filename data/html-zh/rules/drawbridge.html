<h1>吊桥</h1>
经典接龙类型。一层。一次重做。

<h3>目标</h3>
将所有卡牌移至收牌堆。

<h3>快速描述</h3>
玩法类似于 <a href="klondike.html">经典接龙</a>
与 <a href="../hexadeck.html">六角A副牌</a>
变化。

<h3>玩法规则</h3>
游戏玩法就像经典接龙。这些行以红黑交替排列。任何牌或序列都可以在空行上打出。奇才队将在比赛中以红队或黑队的替补身份进行比赛。牌是从发牌堆上一次发一张。可以从基础开始打牌。
<h3>技巧</h3>
将牌从牌座上向后打出，以揭开面朝下的牌。
