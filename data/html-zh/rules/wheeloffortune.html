<h1>命运之轮</h1>
<p>
塔罗克型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
桌面上的牌按花色依次递减。一行牌中只能放置两张牌。一次只能移动一张卡。任何牌都可以在空列牌堆上打出。等级的基础是从 Ace 的花色开始的。发牌堆一次发两张牌。

<h3>技巧</h3>
<p>
在游戏的早期阶段，保持一排或多排开放的牌堆至关重要，因为一次会发两张牌。同样重要的是不要让低排名的卡牌被埋在翻牌堆堆中太深。尽你所能将尽可能多的牌放在列牌堆上。
