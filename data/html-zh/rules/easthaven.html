<h1>东港</h1>
<p>
吉普赛类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有卡牌移至收牌堆。

<h3>快速描述</h3>
<p>
玩法类似于 <a href="klondike.html">经典接龙</a>，但任何东西都在空的空间上，并且没有重发。

<h3>玩法规则</h3>
<p>
牌堆按不同的颜色堆积起来，空白的空间可以用任何牌或序列填充。
<p>
当你没有手数时，你可以从发牌堆中发一张牌到每个列牌堆的顶部。
<p>
您还可以将牌移出收牌堆。
