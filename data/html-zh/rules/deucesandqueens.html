<h1>平分和皇后</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="acesandkings.html">A 和 K</a>，但有三个储备，一组基础从两个构建到 A，另一组从 Q 构建到 K，两者都根据需要包裹在 K 和 A 之间。
<p>
此外，允许在列牌堆上进行建造。列牌堆按点数向上或向下排列，无论花色如何，也根据需要在 K 和 A 之间排列。但一旦发牌堆空了，空的列牌堆就无法再被填满。
