<h1>蟾蜍</h1>
<p>
数值类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
一次从发牌堆发 13 张牌。这些牌可以移动到五个列牌堆之一。无论花色或等级如何，都可以建立工作台堆，但工作台上的牌只能移至接牌堆。
<p>
基础是由相同的花色建立的。一旦所有 13 张牌都移至列牌堆或收牌堆中，就会从发牌堆再发 13 张牌。
<p>
如果所有牌都移到了牌堆上，则游戏获胜。
