<h1>脚蹼</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="penguin.html">企鹅接龙</a>，但在游戏开始时不会向收牌堆发牌（例如 <a href="tuxedo.html">燕尾服</a>).
<p>
如果使用了任何储备，则旁边的列牌堆的顶牌将面朝下翻转，并且在该储备清空之前该堆不能使用。
