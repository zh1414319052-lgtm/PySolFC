<h1>针</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌分为九堆，最外面的四堆有八张牌，接下来的两堆有四张牌，接下来的两堆有两张牌，中间的一堆是空的。剩下的八张牌发给备用牌。
<p>
牌可以在列牌堆之间一次移动一张，通过红黑交替将它们构建下来，并且任何牌都可以用来填充空的牌堆。基础是按花色建立的，从 A 开始。
<p>
备用区中的顶牌可以移至适当的列牌堆或底座。任何单张卡都可以移至备用区，但备用区中的卡牌不得超过十八张。
<p>
如果所有牌都移至牌堆，则游戏获胜。
