<h1>小四十</h1>
<p>
四十大盗类型。 2 副牌。 3次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="fortythieves.html">四十大盗</a>，但牌堆仅按点数递减，如果序列按花色和等级递减，则可以移动序列，空牌堆会自动从废牌或爪牌中填充，每次发 3 张牌，并重发 3 次。

<h3>历史</h3>
<p>
这是一个组合
<a href="fortythieves.html">四十大盗类型</a> 和
<a href="spider.html">蜘蛛型</a>
游戏元素。
