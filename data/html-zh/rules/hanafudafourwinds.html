<h1>四风</h1>
<p>
花札型。 1 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌按点数、花色升序在四个收牌堆上打出。牌按花色降序排列在四列牌堆上。行堆最多可容纳三张牌。一次只能移动一张卡。任何牌都可以在空行堆上打出，但只有相同等级的牌才能在部分填充的行上打出。发牌堆只有两次通过。

<h3>技巧</h3>
<p>
要在四风中获胜需要一点运气和大量技巧，以充分利用列牌堆来发挥最大优势。
<p>
提示：尝试保持一列牌堆打开。
