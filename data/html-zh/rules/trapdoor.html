<h1>活板门</h1>
<p>
吉普赛类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到八堆列牌堆上，每堆三张牌。只有每堆最上面的牌是面朝上的。八张牌被发到八个备用堆，每个列牌堆下面一张。
<p>
画面桩是按红黑交替建造的。任何纸牌或有效的纸牌序列都可以在纸牌堆之间移动。储备区的卡牌可以移至桌面，但不允许在储备区进行建造。
<p>
当没有剩下的手牌时，每个备用牌可以移到相关列牌堆的顶部，并向备用牌发八张新牌。
<p>
基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
