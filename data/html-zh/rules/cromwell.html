<h1>克伦威尔</h1>
<p>
粉丝游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
26 个列牌堆各发四张牌。列牌堆是按花色排列的，任何纸牌或有效的纸牌序列都可以在列牌堆之间移动。空的列牌堆无法被填充。
<p>
收牌堆由从 A 到 K 的相同花色组成 - 如果所有牌都移至收牌堆，则游戏获胜。
<p>
一旦在游戏过程中，风扇顶部下方的任何一张牌都可以被抽出并用于基础或风扇构建。通过将扇子最上面的牌移至抽牌堆来完成此操作。

<h3>补充说明</h3>
<p>
克伦威尔是查尔斯·朱厄尔发明的。
