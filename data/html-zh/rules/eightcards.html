<h1>八张牌（Acht Karten）</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
丢弃所有牌。

<h3>玩法规则</h3>
<p>
画面上发了八张牌。总等级为 11 的卡牌将被移除并从画面中替换。图片卡可以自行移除。在游戏过程中最多两次，您可以从发牌堆上抽一张牌作为第九张牌，然后可以将其与适当的工作牌配对。
<p>
当列牌堆全部消失时，您就赢了。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
