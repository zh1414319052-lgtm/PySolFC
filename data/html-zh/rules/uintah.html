<h1>尤因塔</h1>
<p>
高尔夫类型。 1 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
Uintah 是一个变体 <a href="robert.html">罗伯特</a>
和 <a href="wasatch.html">瓦萨奇</a> 有四个基础。
<p>
游戏开始时，每种花色的一张随机牌被放置在每个底座上。
<p>
牌是从牌库中三张发的。翻牌堆中的牌可以移到基础上，按点数向上或向下构建相同颜色的牌。
<p>
该序列循环，因此 A 可以打在 K 上，反之亦然。
<p>
当所有牌都移到牌堆上时，游戏获胜。
