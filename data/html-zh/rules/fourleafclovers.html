<h1>四叶草</h1>
<p>
高尔夫类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
这些牌被发到十三堆工作画面上，每堆四张牌。列牌堆按点数向上或向下构建，无论花色如何。牌可以在列牌堆之间移动，一次一张。
<p>
从 A 到 K 建立一个单一的基础，然后根据需要从 K 到 A 进行环绕。如果所有牌都移至牌堆，则游戏获胜。
