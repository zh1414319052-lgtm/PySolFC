<h1>艾格尼丝·贝尔诺尔</h1>
<p>
拉格伦型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌面朝上分为七堆，长度递增。七张牌留作备用堆，一张牌发到收牌堆。这张卡决定了收牌堆的起始点数。
<p>
列牌区 中的牌是按红黑交替叠放的。按顺序排列的牌组可以一起移动。
<p>
每发牌都会将一张牌从发牌堆翻转到每个备用堆的顶部。不能重新发牌。
<p>
收牌堆按花色顺序构建，必要时从 K 到 A 依次排列。收牌堆中的牌仍然有效。如果可以的话，双击 列牌区 中的牌会将其移动到适当的收牌堆中。
