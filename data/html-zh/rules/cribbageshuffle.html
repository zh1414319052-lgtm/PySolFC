<h1>克里比奇换位</h1>
<p>使用 1 副牌，不能重新发牌。</p>
<h3>目标</h3>
<p>交换方阵里的牌，使四个横行和四个纵列的总分达到 61 分。</p>
<h3>玩法规则</h3>
<ol>
<li>开局将 16 张牌摆成 4×4 方阵，另外翻开 1 张起始牌。</li>
<li>可交换方阵里的任意两张牌。起始牌的位置固定。</li>
<li>每个横行和纵列各是一组，以该组的 4 张牌和起始牌计分。八组合计达到 61 分即获胜。</li>
</ol>
<p>各组按<a href="cribbagepatience.html">克里比奇接龙的计分方法</a>计分。</p>
