<h1>轻松的时钟</h1>
<p>
一层游戏类型。 1 副牌。没有重售。

<h3>目标</h3>
<p>
在第四个国王被揭开之前，将所有牌移至画面中正确的牌堆，并且您从中抽出牌的额外牌堆将被填满。

<h3>玩法简介</h3>
<p>
就像 <a href="clock.html">钟表接龙</a>，但每局游戏一次，在所有四张国王都被揭开后，您可以从另一堆牌中取出一张面朝下的牌并继续玩。
