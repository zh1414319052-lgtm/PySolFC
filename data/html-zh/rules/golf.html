<h1>高尔夫</h1>
<p>
高尔夫类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有卡牌移至翻牌堆。

<h3>玩法规则</h3>
<p>
无论花色如何，都按向上或向下的顺序在翻牌堆上建造。
<p>
只有最上面的牌可以在牌堆上玩。当无法再移动时，点击发牌堆发一张新牌。
<p>
序列不会环绕，即只有 2 可以放置在 A 上，并且只有 Q 可以放置在 K 上。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。

<h3>技巧</h3>
<p>
为 A 保留 2 点，为 K 保留 Q 点。
