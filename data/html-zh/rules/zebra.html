<h1>斑马</h1>
<p>
四十大盗类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="fortythieves.html">四十大盗</a>，但是 8 根桩是按红黑交替建造的，收牌堆 <b>通过红黑交替构建</b>，空堆会自动从翻牌堆或发牌堆中填充，并重新发牌。
