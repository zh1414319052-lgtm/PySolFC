<h1>梅林的蜿蜒曲折</h1>
辫子型。两层副牌。两次重做。

<h3>目标</h3>
将所有花色牌移至收牌堆。
<h3>快速描述</h3>
玩法类似于 <a href="braid.html">发辫</a>
与 <a href="../hexadeck.html">六角A副牌</a>
变化。

<h3>玩法规则</h3>
游戏玩法就像《时空幻境》。在 Hex A Deck 变体中，奇才队没有自己的基础。收牌堆左侧有两个备用堆，每个堆栈最多可容纳三名奇才。当所有花色牌都移至牌堆时，游戏获胜。
<h3>技巧</h3>
在行上构建序列，当正确的牌从发牌堆上翻转时，将播放该序列。除非需要，否则不要填充向导堆栈。
