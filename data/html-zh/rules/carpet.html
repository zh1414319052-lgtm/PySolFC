<h1>地毯</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
这四个基础是按照从 A 到 K 的花色建立的。
<p>
20 个备用堆可以容纳任何单张牌。
<p>
当你点击发牌堆时，一张牌就会被翻到翻牌堆上。不能重新发牌。
