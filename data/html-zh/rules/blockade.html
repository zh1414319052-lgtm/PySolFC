<h1>封锁</h1>
<p>
吉普赛类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
十二张牌发到十二个列牌堆上。列牌堆可以用相同的花色来建造，任何有效的牌或牌序列都可以在牌堆之间移动。空的列牌堆会立即用发牌堆中的一张牌填充 - 如果发牌堆是空的，则任何牌或序列都可以移动到空堆中。
<p>
如果你卡住了，你可以从发牌堆上发一张牌到每个列牌堆的顶部。
<p>
从 A 到 K 的基础都是由相同的花色建立起来的。当所有牌都移至牌堆时，游戏获胜。
