<h1>火花</h1>
<p>
四十大盗类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
十二张牌被分发到十二个列牌堆中。这些桩是按花色叠起来的。一次只能移动一张卡。任何卡牌都可以用来填充画面中的空牌堆。从K开始，以相同的花色建造八个基础桩。
<p>
发牌堆上的牌会被发到两个翻牌堆，每次发三张牌。翻牌堆中的顶牌可以移至桌面堆或接龙堆中。如果所有牌都移至收牌堆，则游戏获胜。
