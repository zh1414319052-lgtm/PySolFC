<h1>八贤</h1>
<p>
经典接龙类型。 2 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
八堆列牌堆中每堆都会发一张牌。画面桩是按红黑交替建造的。卡牌不能在列牌堆之间移动 - 只有废弃堆中的卡牌才能移动到列牌堆。空的列牌堆可以用翻牌堆中的任何卡牌填充。
<p>
一次从发牌堆上发一张牌，这些牌可以移动到画面或基础上。允许重发一次，因此您可以浏览这副牌两次。
<p>
基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
