<h1>蝎子塔</h1>
<p>
蜘蛛型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 K 到 A 的花色降序排列，每组 13 张牌。

<h3>玩法规则</h3>
<p>
50 张牌分为十列，每列五张。剩下的两张牌被发给四个备用单元中的两个。 列牌区 列由相同的花色构建而成。
<p>
空白的画面通常只能由国王来填补。然而，如果所有四张国王都位于列牌堆的底部，则它们可以由任何牌填充。
<p>
当所有牌都被分成四个相同花色的序列（从 K 到 A）时，游戏就获胜。

<h3>补充说明</h3>
<p>
蝎子塔是游戏的组合
<a href="seahaventowers.html">海港塔</a> 和
<a href="scorpion.html">蝎子接龙</a>。它是由托马斯·沃菲尔德发明的。
