<h1>九十一</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
取出所有牌。

<h3>玩法规则</h3>
<p>
这副牌被均匀地分成十三堆。单张牌可以在牌堆之间移动，不受限制。如果所有十三堆顶牌的总点数为 91（K 为 13，Q 为 12，J 为 11），则这些牌将被移除。
<p>
如果您能消除四组 91 张牌中的所有牌，则游戏获胜。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
<p>
从 A 到 K，完整的牌序列的等级总计为 91。但也有其他可能的序列。
