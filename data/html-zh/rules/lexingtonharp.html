<h1>列克星敦竖琴</h1>
<p>
育空类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
画面中的牌是通过红黑交替叠放的。无论顺序如何，卡组都可以移动。空白处可以用任何牌或序列填充。
<p>
基础是按照从 A 到 K 的花色建立的。收牌堆中的牌不再有效。
<p>
当无法再移动时，单击发牌堆。每个游戏牌堆中都会添加一张牌。

<h3>历史</h3>
<p>
这是一个组合
<a href="yukon.html">育空类型</a> 和
<a href="gypsy.html">吉普赛型</a>
游戏元素。
