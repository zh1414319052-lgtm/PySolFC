<h1>维吉尼亚·瑞尔</h1>
<p>
图片库类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
弗吉尼亚卷轴是一个变体 <a href="royalparade.html">皇家巡游</a>，旨在改进该游戏。
<p>
游戏玩法类似，只是不会发牌来替换画面底行中的空牌堆。此外，如果画面前三行留有任何空白，必须立即填充。如果不能，则在填满之前不能从发牌堆抽取更多牌。
<p>
此外，游戏开始时，2、3 和 4 会被发到最左边的列牌堆上。
