<h1>奎妮</h1>
<p>
育空类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有卡牌移至收牌堆。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="yukon.html">育空地区</a>，但不要在游戏开始时发完所有牌。

<h3>玩法规则</h3>
<p>
列牌区 中的牌是按红黑交替叠放的。无论顺序如何，卡组都可以移动。画面中的空牌堆可以填充一张国王或一组底部有一张国王的牌。
<p>
基础是按照从 A 到 K 的花色建立的。收牌堆中的牌不再有效。
<p>
当无法再移动时，单击“发牌堆”。每个游戏牌堆中都会添加一张牌。
