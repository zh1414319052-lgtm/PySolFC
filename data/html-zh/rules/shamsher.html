<h1>沙姆谢尔</h1>
莫卧儿甘吉法型。一层。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>快速描述</h3>
画面上的牌无论花色如何，都按点数递减，一行最多不超过十二张。任何牌或可移动牌堆都可以在空行上打出。

<h3>玩法规则</h3>
游戏开始时，所有牌都会发到十四排。画面上的牌按点数递减排列。基础是通过西装建立起来的。任何牌或可移动牌堆都可以在空行上打出。

<h3>技巧</h3>
第一要务是清空一行。然后不要填充它，除非可以通过这样做清空它或另一行。
