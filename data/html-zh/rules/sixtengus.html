<h1>六天狗</h1>
花札型。 1 副牌。不能重新发牌。

<h3>目标</h3>
将所有牌移到收牌区。

<h3>玩法规则</h3>
玩法与
<a href="japanesegarden.html">日本花园</a>
除了有六列牌堆，每行最多可容纳九张牌。如果两张牌按点数顺序排列，则可以一次移动两张牌。

<h3>补充说明</h3>
天狗是日本神话人物，具有非凡的战斗技巧。您自己需要高超的技巧（并且不仅仅是一点运气）才能克服其中的六个。
