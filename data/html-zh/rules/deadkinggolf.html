<h1>死王高尔夫</h1>
<p>
高尔夫类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有卡牌移至翻牌堆。

<h3>玩法简介</h3>
<p>
就像 <a href="golf.html">高尔夫</a>，但是 <em>什么都没有</em> 可以放置在国王身上。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
