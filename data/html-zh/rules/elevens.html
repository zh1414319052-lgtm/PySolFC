<h1>十一人</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
画面上发了九张牌。总共十一张的牌对可以移到基础上，空间从发牌堆中填充。
<p>
一组杰克、王后、国王中的图片牌被移除。每种类型的一张图片卡可以移动到三个备用区，并且在其后面填充列牌堆。一旦这三个储备区包含每张图片卡中的一张，它们就会全部移至基础中。
<p>
如果所有牌都被丢弃，则游戏获胜。

<h3>补充说明</h3>
<p>

<i>自动投放</i> 此游戏已禁用。
