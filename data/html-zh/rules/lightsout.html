<h1>熄灯</h1>
熄灯型。一层。没有重售。

<h3>目标</h3>
将所有牌正面朝下翻转。

<h3>玩法规则</h3>
<p>
许多牌以方形网格形式分发，其中一些牌面朝上，另一些牌面朝下。任何单张牌都可以翻转 - 如果翻转一张牌，则其所有水平或垂直相邻的牌也会翻转。
<p>
如果每张牌同时翻转面朝下，则游戏获胜。
