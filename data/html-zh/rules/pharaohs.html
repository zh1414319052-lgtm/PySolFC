<h1>法老王</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
丢弃所有牌。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="pyramid.html">金字塔接龙</a>，但没有库存，布局涉及三个金字塔 - 一个有七行，一个有六行，一个有两行。
