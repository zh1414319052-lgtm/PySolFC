<h1>夏威夷语</h1>
<p>
育空类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
五十张牌分为十堆，每堆五张牌。剩下的 54 张牌被发到备用堆。
<p>
画面中的牌是通过红黑交替叠放的。无论顺序如何，卡组都可以移动。任何牌或序列都可以用来填充空堆。
<p>
备用堆的顶牌可以移至任何合适的画面或收牌堆。
<p>
基础是按照从 A 到 K 的花色建立起来的。当所有牌都移至牌堆时，游戏获胜。
