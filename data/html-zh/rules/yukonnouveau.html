<h1>新育空地区</h1>
<p>
塔罗克型。 1 副牌。无限次重发。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="imperialtrumpyukon.html">帝国王牌育空地区</a>，但是有九个列牌堆（奇数牌会发到第一个列牌堆），并且在建立其他牌堆之前不需要将牌移到王牌牌堆上。
