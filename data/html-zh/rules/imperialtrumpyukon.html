<h1>帝国王牌育空地区</h1>
<p>
塔罗克型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
这个游戏类似于 <a href="yukon.html">育空地区</a> 但二十二张王牌将打在下一个更高等级的任何花色牌上。只有先打出同等等级的王牌时，牌才会在基础上打出。这意味着黑桃 A 不会在黑桃基础上发挥，除非王牌 A 在王牌基础上发挥。只有国王或排名最高的王牌可以在空列牌堆上玩。最高的王牌被称为“愚者”或“斯基兹”，具体取决于套牌的类型。它的编号要么为 0，要么没有编号。牌可以从基础到画面进行打出。
