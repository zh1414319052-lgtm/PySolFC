<h1>红心王牌</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移至单一基础上。

<h3>玩法规则</h3>
<p>
牌分为七堆，每堆牌的数量递增（第一堆 1 张，第二堆 2 张，依此类推），全部面朝上。
<p>
将相同花色的列牌堆堆起来。任何一组牌都可以移动，无论顺序如何。只有一张国王或一组以国王开头的牌可以移至空牌堆中。当没有剩余的动作时，您可以从发牌堆中向每一堆发一张牌。
<p>
单一基础是从红桃A开始的。打完红桃 A 后，无论花色如何，都会按点数累积，根据需要从 K 转变成 A。如果所有牌都移动到这一基础上，则游戏获胜。
