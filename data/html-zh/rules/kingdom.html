<h1>王国</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
基础是通过无视花色的等级来建立的。
<p>
备用堆可以容纳一张牌，并自动从废牌或发牌堆中填充。
<p>
列牌堆上没有建筑物，所以你只能将牌移动到收牌堆上。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
