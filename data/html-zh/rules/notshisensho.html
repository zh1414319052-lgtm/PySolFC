<h1>不是十仙翔</h1>
<p>
不是 Shisen-Sho 是一个变体 <a href="shisensho.html">十仙翔</a>.

<h3>目标</h3>
<p>
游戏的目标是消除场地上的所有瓷砖。

<h3>玩法简介</h3>
<p>
不是Shisen-Sho 的演奏方式是这样的 <a href="shisensho.html">十仙翔</a>
除了成对的瓷砖只有在水平或垂直位于同一行时才能被移除，即使它们之间还有其他瓷砖。
