<h1>罗伯特</h1>
<p>
高尔夫类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移至收牌堆。

<h3>玩法规则</h3>
<p>
从发牌堆一次发一张牌。翻牌堆中的卡牌可以移至收牌堆，按点数向上或向下建造。您可以重发两次，这意味着您总共可以浏览这副牌三次。
<p>
该序列循环，因此 A 可以打在 K 上，反之亦然。
<p>
当所有牌都移至牌堆时，游戏获胜。
