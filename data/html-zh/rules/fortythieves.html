<h1>四十大盗</h1>
<p>
四十大盗类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
四十张牌分为 10 堆。这些桩是按花色建造的。只有一堆牌中最上面的牌可以玩，任何牌都可以填充空格。
<p>
发牌堆上的牌被一次一张地扔进翻牌堆。您可以将最左边的牌移至游戏牌堆或牌堆上。不能重新发牌。

<h3>历史</h3>
<p>
这是一款经典的纸牌游戏，其历史可能可以追溯到十九世纪。它有很多名字，例如
<i>拿破仑在圣赫勒拿岛</i>, <i>大四十</i> 和 <i>勒卡德兰</i>.
