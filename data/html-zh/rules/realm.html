<h1>境界</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌被发到八堆列牌堆上——四堆有六张牌，四堆有七张牌。列牌堆按红黑交替上下排列，并且只能在列牌堆之间移动单张牌。空的列牌堆无法被填充。
<p>
有两套基础 - 一套是从 A 到 K 开始按花色建立的，而另一套是从 K 到 A 依次建立的。基础中的卡牌无法移动。
<p>
当所有牌都移至牌堆时，游戏获胜。每个基础中有多少张牌并不重要。
