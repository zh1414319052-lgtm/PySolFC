<h1>星形胶质细胞</h1>
<p>
蜘蛛型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 K 到 A 的花色降序排列为 13 张牌组，并将这些牌组移至牌堆。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="spider.html">蜘蛛</a>，但有八列，每列八张牌，外加四个空当。

<h3>补充说明</h3>
<p>
星形胶质细胞由 Jan Wolter 发明，首次出现在他的应用程序中
<a href="https://politaire.com">政治家</a>。该游戏是几种不同变体的组合 <a href="spidercells.html">蜘蛛细胞</a>，以大脑中有时被称为“蜘蛛细胞”的星形细胞命名。
