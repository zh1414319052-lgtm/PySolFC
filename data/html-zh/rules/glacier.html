<h1>冰川</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
开局向 12 个列牌堆各发 1 张牌。列牌堆按点数递减叠牌，花色不限，A 后可接 K。符合规则的单张牌或连续牌组可在列牌堆之间移动，空列可接任意连续牌组。
<p>
每次从发牌堆翻出 2 张牌，放到翻牌堆。翻牌堆顶牌可以移到收牌堆或列牌堆。两张都移走后才能继续翻牌。
<p>
收牌堆按同花色从 A 递增到 K，再接 A 开始第二轮。所有牌都送到收牌区即获胜。
