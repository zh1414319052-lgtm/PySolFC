<h1>较小的队列</h1>
辫子型。 2 副牌。两次重做。

<h3>目标</h3>
将所有卡牌移至收牌堆。

<h3>快速描述</h3>
玩法类似于
<a href="braid.html">发辫</a>.

<h3>玩法规则</h3>
收牌堆按照等级从松树到泡桐的升序顺序建造。发牌堆一次发一张牌，并且允许重发两次。牌不能从基础开始打。

<h3>技巧</h3>
在行上构建序列，当正确的牌从发牌堆上翻转时，将播放该序列。辫子类型的游戏需要谨慎的策略才能获胜。
