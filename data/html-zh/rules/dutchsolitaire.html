<h1>荷兰纸牌</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
五个收牌堆各发一张 A，这些收牌堆排列在游戏区中央的 X 形图案中。 6 个列牌堆各发 10 张牌，排列成只有最上面的牌可见，牌座上方和下方各各一张，左右各各两张。
<p>
工作台和基础桩都是按点数向上或向下建造的，无论花色如何。单张牌可以在牌堆之间移动。当没有剩余手数时，您可以一次从发牌堆上发一张牌，并将它们移动到适当的牌堆中。不允许重发。如果所有牌都移至牌堆，则游戏获胜。
