<h1>S 形接龙</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
每个等级的牌会发到 13 个收牌堆中的每一堆，这些收牌堆像字母 S 一样排列。这些接龙牌是按点数叠放的，无论花色如何，每堆最多 8 张牌。
<p>
牌一次从发牌堆上发一张，并且可以移动到牌堆或两个列牌堆之一。不允许在这些列牌堆上进行建造，并且可以将其中任一顶牌移动到适当的收牌堆上。不允许重发。如果所有牌都移至牌堆，则游戏获胜。
