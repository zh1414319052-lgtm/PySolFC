<h1>流量</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移动到画面上，分成四列，并具有从 K 到 A 的完整顺序。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="wavemotion.html">波动</a>，但牌和牌序列可以在备用堆之间移动。与列牌堆一样，备用堆是由相同花色依次递减的，但只能使用一张牌来填充空的备用堆。
