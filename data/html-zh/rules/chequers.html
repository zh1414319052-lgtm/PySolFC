<h1>跳棋</h1>
<p>
被围困的城堡类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌发到 25 堆，每堆四张牌。列牌堆是按相同花色上下排列的，列牌堆之间只能移动单张牌。空的牌堆会立即用发牌堆上剩余的四张牌中的一张填充，并且一旦发牌堆空了，就可以用任何单张牌填充。
<p>
有两套基础。一种是由相同花色从 A 到 K 组成的，而另一种是由 K 到 A 组成的。如果所有牌都移至牌堆，则游戏获胜。
