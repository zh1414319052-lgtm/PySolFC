<h1>相识</h1>
<p>
数值类型。 1 副牌。 2次重做。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="auldlangsyne.html">友谊地久天长</a>，但允许进行两次重发，其中将列牌堆组合起来并放置在彼此的顶部以形成新的牌组。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
