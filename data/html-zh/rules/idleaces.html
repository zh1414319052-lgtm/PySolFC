<h1>空闲王牌</h1>
<p>
两副牌游戏类型。 2 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
共有三套基础。第一盘各发一张K，第二盘各发一张K。带有K的基础是按照与A相同花色的顺序向下叠放的，而带有K的基础是按照与K相同花色的方式向下叠放的。每个花色的剩余 A 可以在第三组基础中使用。
<p>
牌从发牌堆上一次发一张，并且可以移动到适当的基础上。允许重发两次。如果所有牌都移至牌堆，则游戏获胜。
