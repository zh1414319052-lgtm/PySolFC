<h1>四个季节</h1>
花札型。 1 副牌。不能重新发牌。

<h3>目标</h3>
将所有牌排列成行。

<h3>玩法规则</h3>
这是一个 <a href="fan.html">风扇</a>
适合 Hanafuda 卡的类型游戏。该画面由十二行组成。任何牌堆都可以移动，但只有第一张牌会打在空行上。垃圾牌不可互换，连续打出的牌不得超过八张。当所有十二种花色按顺序排列在画面上各自的位置时，游戏获胜。

<h3>技巧</h3>
并非所有四个季节的牌都可以解决。尝试获得一个空行。
