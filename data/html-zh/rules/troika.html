<h1>三驾马车</h1>
<p>
粉丝游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
牌分为 18 堆，每堆三张（最后一堆只有一张牌）。在最初的发牌过程中，A 会被跳过并直接发送到收牌堆。
<p>
工作台桩是按相同等级建造的。每个列牌堆最多允许三张牌。空堆无法被填满。
<p>
基础是通过西装建立起来的。如果所有牌都移至牌堆，则游戏获胜。
