<h1>拿破仑流放</h1>
<p>
四十大盗类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有卡牌移至收牌堆。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="fortythieves.html">四十大盗</a>，但牌堆按点数递减，忽略花色。
