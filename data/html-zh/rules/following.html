<h1>正在关注</h1>
<p>
四十大盗类型。 1 副牌。 可重新发牌 1 次。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
发出六张牌以形成初始画面。牌可以移动到基础，基础是按照特定的花色顺序按点数建立的，顺序如下：
<ul>
<li>红心</li>
<li>俱乐部</li>
<li>钻石</li>
<li>黑桃</li>
</ul>
<p>
列牌堆按照与收牌堆相同的花色顺序按点数向下构建。画面中的任何牌序列都可以移动。当没有牌可玩时，可以从发牌堆一次发一张牌。允许重交易一次，因此您可以两次浏览该股票。
