<h1>蚊虫</h1>
<p>
数值类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="numerica.html">点数组牌</a>，但一开始就将 A 发到了收牌区，并且收牌堆是按花色建立起来的。此外，还发了六张牌作为备用堆，可以随时将其移动到适当的牌堆。
