<h1>公爵</h1>
<p>
坎菲尔德类型。 1 副牌。 2次重做。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
四个列牌堆各发一张牌，四个备用堆各发三张牌。列牌堆是按红黑交替排列的，任何牌或牌序列都可以在列牌堆之间移动。任何牌或序列都可以填充空的列牌堆。备用堆顶部的牌可以移至桌面或收牌堆，但不能移回备用牌。
<p>
当没有剩余的动作时，您可以一次从发牌堆上发一张牌，并将它们移动到画面或基础上。允许重发两次。基础是由从 A 到 K 的相同花色建立的。如果所有牌都移至牌堆，则游戏获胜。
