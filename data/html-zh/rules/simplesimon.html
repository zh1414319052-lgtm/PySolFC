<h1>简单西蒙</h1>
<p>
蜘蛛型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌按照从 K 到 A 的花色降序排列为 13 张牌组，并将这些牌组移至牌堆。

<h3>玩法简介</h3>
<p>
就像 <a href="spiderette.html">小蜘蛛纸牌</a>，但所有牌都是在开始时以三角形布局发到 10 堆牌。
