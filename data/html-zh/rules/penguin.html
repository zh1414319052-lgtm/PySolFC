<h1>企鹅接龙</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法规则</h3>
<p>
左上角的牌称为 <i>喙</i> 并确定收牌堆的基本等级。其他三张相同点数的牌被放置到牌堆上。
<p>
七堆牌以相同的花色依次排列，从 A 到 K。空白处只能由一张牌或低于喙等级的序列来填充。
<p>
七个空当（也称为 <i>脚蹼</i>）可以容纳任何一张卡。

<h3>补充说明</h3>
<p>
Penguin是David Parlett发明的，原始规则可以查到
<a href="https://www.parlettgames.uk/patience/penguin.html">这里</a>。它也被称为喙和鳍状肢。
