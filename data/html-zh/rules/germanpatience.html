<h1>德国人的耐心</h1>
<p>
两副牌游戏类型。 2 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到画面上，分成八堆，每堆十三张。

<h3>玩法规则</h3>
<p>
八堆列牌堆中每堆都会发一张牌。列牌堆是按点数建立的，无论花色如何，根据需要从 K 转变成 A。列牌堆之间只能移动单张牌，空的牌堆可以由任何牌填充。每个列牌堆最多允许有 13 张牌。
<p>
牌每次从发牌堆发一张，并且可以移动到适当的列牌堆中。不允许重发。如果您设法将所有牌都放到桌面上，形成八堆，每堆十三张牌，则游戏获胜。
