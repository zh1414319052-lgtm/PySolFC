<h1>虎斑猫</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌堆。

<h3>玩法规则</h3>
<p>
无论花色如何，基础都是从 A 到 K 建立的。必须将整个从 A 到 K 的序列移动到基础上作为一步。
<p>
游戏牌堆按点数递减，无论花色如何。可以用 A 打出 K。空的一堆可以容纳任何牌或序列。
<p>
当无法再移动时，单击发牌堆。每个游戏牌堆中都会添加一张牌。
