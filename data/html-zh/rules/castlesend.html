<h1>城堡尽头</h1>
<p>
被围困的城堡类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
玩法类似于 <a href="bastion.html">棱堡</a>，但在移动任何其他牌之前，必须将任何一张牌移至牌堆。然后从该等级开始按花色建立基础，根据需要从 K 到 A。
<p>
此外，列牌堆是通过红黑交替向上或向下叠放的。
