<h1>选择</h1>
<p>
三副牌游戏类型。 3 层剥离副牌。不能重新发牌。

<h3>目标</h3>
<p>
填充所有基础。

<h3>玩法规则</h3>
<p>
该游戏使用三副剥离牌进行，仅包括等级从六到王的牌。
<p>
所有牌都发到十二堆，每堆八张牌。列牌堆是按红黑交替排列的，任何有效的牌序列都可以在列牌堆之间移动。任何牌或序列都可以移至空堆中。
<p>
收牌堆是按点数建造的，从六级到王级，每级各有一个桩。每堆牌堆中的牌的花色顺序必须相同。如果所有牌都移至牌堆，则游戏获胜。
