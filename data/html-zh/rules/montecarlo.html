<h1>蒙特卡洛</h1>
<p>
配对游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
丢弃所有相同点数的牌对。

<h3>玩法规则</h3>
<p>
目标是通过丢弃相同等级的卡牌来用完画面中的所有卡牌。
<p>
只有当两张牌水平、垂直或对角接触时（即两张牌必须是相邻的），您才能将一张牌放在另一张牌的上面。
<p>
当无法再移动时，单击发牌堆。牌将向上移动，底部的空白区域将被填充。
<p>
当列牌堆全部消失时，您就赢了。

<h3>补充说明</h3>
<p>
<i>自动投放</i> 此游戏已禁用。
