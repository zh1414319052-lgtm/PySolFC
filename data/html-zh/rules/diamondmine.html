<h1>钻石矿</h1>
<p>
一层游戏类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有方块移至底牌，并将所有其他牌按花色和顺序排列，其中 A 在画面中处于较低位置。

<h3>玩法规则</h3>
<p>
牌（钻石除外）可以按顺序构建，无论花色如何。卡牌构建可以作为一个单元移动。空槽可以用任何卡牌（钻石除外）或卡牌组合来填充。
<p>
钻石不能移动，除非放置在基础上。钻石基础必须按顺序建立，但可以从您想要的任何数字开始。

<h3>技巧</h3>
<p>
开采钻石是一项艰苦的工作。请记住，并非所有钻石的价值都相同。不要忘记清理干净自己并将其他套装整理好。
