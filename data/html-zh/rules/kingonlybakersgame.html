<h1>King Only贝克的游戏</h1>
<p>
空当接龙类型。 1 副牌。不能重新发牌。

<h3>目标</h3>
<p>
将所有牌移到收牌区。

<h3>玩法简介</h3>
<p>
就像 <a href="bakersgame.html">贝克接龙</a>，但只有国王在空位上。

<h3>玩法规则</h3>
<p>
所有牌均在游戏开始时发出。为了弥补这一点，有 4 个空当可以容纳任何卡（而且只能容纳一张卡）。
<p>
牌堆按花色递减，您只能将 K 移至空位。
<p>
您可以作为序列移动的牌数受到可用单元数的限制 - 所需的可用单元数与使用单张牌进行等效移动序列时所需的可用单元数相同。
